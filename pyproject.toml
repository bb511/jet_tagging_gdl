[project]
name = "jet-tagging-gdl"
version = "0.1.0"
description = "Data augmentation against a symmetry-consistency loss for jet tagging on the hls4ml jet data set."
authors = [
    {name = "Patrick Odagiu", email = "patrickodagiu@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"

requires-python = ">=3.11,<3.13"
# sqlalchemy, pandas, mlflow and pyyaml are imported by no module under src/ or scripts/
# and so are easy to prune by mistake: sqlalchemy holds optuna 2.10's storage layer below
# the 2.x that breaks it, pandas backs optuna's trials_dataframe(), mlflow is the backend
# of MLFlowLogger, and pyyaml comes with omegaconf. pyarrow is what the record's own loader
# reads its parquet shards with, and src/data/jet_level_datamodule.py reads them with it too.
# optuna comes with the sweeper too, but scripts/optuna imports it directly, so it is
# declared.
dependencies = [
    "torch (==2.9.1+cu126)",
    "lightning (>=2.6,<3)",
    "torchmetrics (>=1.9,<2)",
    "hydra-core (>=1.3.2,<2)",
    "hydra-colorlog (>=1.2,<2)",
    "hydra-optuna-sweeper (>=1.2,<2)",
    "optuna (>=2.10,<3)",
    "hydra-submitit-launcher (>=1.2,<2)",
    "sqlalchemy (<2)",
    "rootutils (>=1.0.7,<2)",
    "rich (>=13)",
    "numpy (<2.5)",
    "pandas (<3)",
    "pyarrow (>=21,<26)",
    "omegaconf (>=2.3)",
    "pyyaml (>=6,<7)",
    "scikit-learn (>=1.4,<2)",
    "matplotlib (>=3.8)",
    "mplhep (>=0.4)",
    "mlflow (>=3.2,<4)",
    "huggingface-hub (>=1.0)",
    # The L-GATr-slim network itself (src/algorithms/components/lgatr_slim.py wraps it);
    # padding goes through a dense mask, so none of its attention extras is needed.
    "lgatr (>=2.0.0,<3)",
    # The LLoCa frames-net, local frames and tensorial transformer
    # (src/algorithms/components/lloca.py wraps them); its frames-net is built on
    # torch-geometric, which comes along with it.
    "lloca (>=2.0.0,<3)",
]

[dependency-groups]
dev = [
    "pytest (>=8,<10)",
    "pre-commit (>=3.7,<5)",
]

# The CUDA 12.6 build of torch is not on PyPI, so it is pulled from the PyTorch index.
[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch-cu126"}

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
