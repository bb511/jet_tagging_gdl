[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

[[tool.poetry.source]]
name = "nvidia"
url = "https://pypi.nvidia.com"
priority = "supplemental"


[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch-cu126"}
torchvision = {source = "pytorch-cu126"}
[project]
name = "jet-tagging-gdl"
version = "0.1.0"
description = ""
authors = [
    {name = "Patrick Odagiu",email = "patrickodagiu@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<=3.12"
dependencies = [
    "torch (==2.9.1+cu126)",
    "torchvision (==0.24.1+cu126)",
    "lightning (>=2.6.5,<3.0.0)",
    "torchmetrics (>=1.9.0,<2.0.0)",
    "hydra-core (>=1.3.5,<2.0.0)",
    "rootutils (>=1.0.7,<2.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "numpy (<2.5)",
    "scipy (<1.18)",
    "pandas (<3)",
    "h5py (>=3.16.0,<4.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "wget (>=3.2,<4.0)",
    "deel-torchlip (>=1.0.5,<2.0.0)",
    "hydra-submitit-launcher (>=1.2.0,<2.0.0)",
    "mlflow (>=3.15.1,<4.0.0)",
    "hydra-optuna-sweeper (>=1.2.0,<2.0.0)",
    "sqlalchemy (<2.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "sh (>=2.4.0,<3.0.0)"
]
