outdir: 'trained_models'

model_hyperparameter:
  deepset:
    phi_layers: [32,32,32]
    rho_layers: [32]
    activ: "relu"
    aggreg: "mean"
    dropout: -1
    output_dim: 5
  vector_neuron:
    out_channel: 5
    hidden : 20
    num_layers: 4
    add_mlp : False
  vn_etaphi_rel:
    out_channel: 5
    hidden : 43
    num_layers: 4
    hidden_mlp : 16
    num_layers_mlp : 3
  vector_neuron_lorentz:
    out_channel: 5
    hidden : 20
    num_layers: 2
  vn_dgcnn:
    n_knn : 8
    output : 5
    pooling : "mean"
  dgcnn:
    n_knn : 8
    output : 5
    pooling : "mean"
  graph_net:
    hidden_channels : 32
    out_channels : 5 
    num_layers : 3
  transformer:
    lifting_dim: 128
    num_layers: 4
    d_models: 128
    nhead: 8
    output_size: 5
    norm: None

training_hyperparams : 
  epochs :  1
  lr : 0.0001
  batch_size: 256
  loss_inv : False

validation : True