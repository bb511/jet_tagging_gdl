# PELICAN ~6k parameter configuration (matches upstream 6k.yaml).
# SO(2) stabilizer with spurion symmetry-breaking.
_target_: src.models.pelican_module.PELICANModule

num_classes: 5
nbr_feats: 5
nconstituents: ${data.nconstituents}
average_nobj: ${data.nconstituents}

rank1_dim_multiplier: 2
num_channels_scalar: 10

num_channels_m:
  - [16]
  - [16]
  - [16]
  - [16]
  - [16]

num_channels_2to2: [10, 10, 10, 10, 10]
num_channels_m_out: [16, 10]
num_channels_out: [16]

stabilizer: so2
spurion_method: spurions

config: "M"
config_out: "M"
activation: leakyrelu
batchnorm: "b"
masked: true

activate_agg_in: false
activate_lin_in: true
activate_agg: false
activate_lin: true
activate_agg_out: true
activate_lin_out: false

factorize: true
mlp_out: true
irc_safe: false

dropout: false
drop_rate: 0.1
drop_rate_out: 0.1

method: ${data.method}
group: so2
symm_loss_weight: 0.1

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 2.5e-03
  weight_decay: 0.0
  betas: [0.9, 0.999]

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  _partial_: true
  T_0: 4
  T_mult: 2
  eta_min: 1.0e-5
