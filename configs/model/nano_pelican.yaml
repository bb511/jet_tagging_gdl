_target_: src.models.nano_pelican_module.PELICANNanoModule

# Architecture
n_hidden: 32
output_dim: 5
nbr_feats: 5
nconstituents: ${data.nconstituents}
average_nobj: ${data.nconstituents}   # scales equivariant ops to expected jet size
activation: leakyrelu
config: "s"
config_out: "s"
activate_agg: false
activate_lin: true
activate_agg_out: true
activate_lin_out: false
factorize: false
masked: true
dropout: false
drop_rate: 0.0
drop_rate_out: 0.0
batchnorm: none

# Training
method: ${data.method}
symm_loss_weight: 0.1

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-03
  weight_decay: 1.0e-05
  betas: [0.9, 0.999]