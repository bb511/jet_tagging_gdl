# PELICAN ~208k parameter configuration (highest performance on multi-class HLS4ML).
# Corresponds to the 132/78 configuration in the PELICAN paper.
_target_: src.models.pelican_module.PELICANModule

# ── Dimensions ──────────────────────────────────────────────────────────────
num_classes: 5
nbr_feats: 5
nconstituents: ${data.nconstituents}
average_nobj: ${data.nconstituents}

# ── Architecture (matches paper 132/78 multi-class config) ──────────────────
rank1_dim_multiplier: 2
num_channels_scalar: 10

# Message block dimensions (132 across the board)
num_channels_m:
  - [132]
  - [132]
  - [132]
  - [132]
  - [132]

# Equivariant block dims (78 across the board)
num_channels_2to2: [78, 78, 78, 78, 78]

# Output channels
num_channels_m_out: [132, 78]
num_channels_out: [132]

# ── Symmetry / stabilizer ───────────────────────────────────────────────────
stabilizer: so2
spurion_method: spurions

# ── Aggregation config strings ───────────────────────────────────────────────
config: "M"
config_out: "M"

# ── Activation & normalisation ───────────────────────────────────────────────
activation: leakyrelu
batchnorm: "b"
masked: true

activate_agg_in: false
activate_lin_in: true
activate_agg: false
activate_lin: true
activate_agg_out: true
activate_lin_out: false

factorize: true
mlp_out: true
irc_safe: false

dropout: true
drop_rate: 0.25
drop_rate_out: 0.1

# ── Training method ──────────────────────────────────────────────────────────
method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1

# ── Optimiser ────────────────────────────────────────────────────────────────
compile: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 2.5e-03
  weight_decay: 0.0
  betas: [0.9, 0.999]

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  _partial_: true
  T_0: 4
  T_mult: 2
  eta_min: 1.0e-5
