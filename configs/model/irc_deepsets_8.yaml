# nconst=8: phi [128,64], rho [128,64], relu, sum, no dropout, mask=True
_target_: src.models.irc_deepsets_module.DeepSetsInvariantIRC

nbr_feats: 5
nconstituents: ${data.nconstituents}
phi_layers: [128, 64]
rho_layers: [128, 64]
method: ${data.method}
group: ${data.augmentation_scheme}
activation: "relu"
aggregation: "sum"
dropout: -1
output_dim: 5
mask: true

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.001
  weight_decay: 1e-7

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: "max"
  patience: 80
  factor: 0.1
  threshold: 1e-4

symm_loss_weight: 0.1
