# LipschitzMLP for nconst=16: in_dim = 16 * 5 = 80
_target_: src.models.lipschitz_module.LipschitzMLPClassifier

nbr_feats: 5
nconstituents: 16
hidden_layers: [128, 64]
output_dim: 5
activation: "groupsort2"
k_coef_lip: 1.0
method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.001
  weight_decay: 1.0e-7

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: "max"
  patience: 80
  factor: 0.1
  threshold: 1.0e-4
