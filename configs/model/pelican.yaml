_target_: src.models.pelican_module.PELICANModule

# ── Dimensions ──────────────────────────────────────────────────────────────
num_classes: 5
nbr_feats: 5
nconstituents: ${data.nconstituents}
average_nobj: ${data.nconstituents}

# ── Architecture (matches upstream PELICAN 6k config) ──────────────────────
# rank1_dim_multiplier: channels per rank-1 feature in the InputEncoder
rank1_dim_multiplier: 2

# num_channels_scalar: output dim of Eq1to2 block (scalar → pairwise projection)
#   Only used when stabilizer != 'so13' / spurion_method = 'spurions'
num_channels_scalar: 10

# num_channels_m: hidden dims in each message net (one list per 2→2 layer).
#   len must equal len(num_channels_2to2).
#   First element [num_channels_m[0][0]] defines the total embedding_dim
#   (= rank2 channels + num_channels_scalar when scalars are present).
num_channels_m:
  - [16]
  - [16]
  - [16]
  - [16]
  - [16]

# num_channels_2to2: channel widths for each Eq2to2 layer.
#   len must equal len(num_channels_m).
num_channels_2to2: [10, 10, 10, 10, 10]

# num_channels_m_out: message net between Net2to2 and Eq2to0.
#   First element = output dim of final Eq2to2.
#   Last element  = input dim of Eq2to0.
num_channels_m_out: [16, 10]

# num_channels_out: output MLP hidden dims (excl. final num_classes layer).
num_channels_out: [16]

# ── Symmetry / stabilizer ───────────────────────────────────────────────────
# stabilizer: Lorentz subgroup whose invariants are used as inputs.
#   so13 (fully invariant) | so3 | so12 | se2 | so2 | R | 1 | 11
# spurion_method: how to break symmetry to the stabilizer subgroup.
#   'spurions' — prepend reference 4-vectors (recommended)
#   'input'    — use so13 invariants only (fully invariant, no breaking)
stabilizer: so13
spurion_method: input

# ── Aggregation config strings ───────────────────────────────────────────────
# Letters: s=sum  m=mean  x=max  n=min  (UPPER = same + n_obj scaling)
config: "M"
config_out: "M"

# ── Activation & normalisation ───────────────────────────────────────────────
activation: leakyrelu
batchnorm: "b"        # b=batch  i=instance  l=layer  null=none
masked: true

activate_agg_in: false
activate_lin_in: true
activate_agg: false
activate_lin: true
activate_agg_out: true
activate_lin_out: false

factorize: true
mlp_out: true
irc_safe: false

dropout: false
drop_rate: 0.1
drop_rate_out: 0.1

# ── Training method ──────────────────────────────────────────────────────────
method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1

# ── Optimiser ────────────────────────────────────────────────────────────────
compile: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 2.5e-03
  weight_decay: 0.0
  betas: [0.9, 0.999]

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  _partial_: true
  T_0: 4
  T_mult: 2
  eta_min: 1.0e-5
