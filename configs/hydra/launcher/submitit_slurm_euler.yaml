# @package hydra.launcher
defaults:
  - submitit_slurm

submitit_folder: /cluster/scratch/agogia/submitit/%j

account: null
qos: null

partition: cuda13pr
timeout_min: 1440
cpus_per_task: 4
tasks_per_node: 1
nodes: 1

array_parallelism: 200

name: ${hydra.job.name}

additional_parameters:
  gpus: "nvidia_rtx_pro_6000:1"
  mem_per_cpu: "20G"

setup:
  - source /cluster/home/agogia/pl_hydra_implementation/HYDRA/bin/activate
  - export PYTHONPATH=/cluster/home/agogia/jet_tagging_gdl:$PYTHONPATH
  - export CUDA_VISIBLE_DEVICES=$SLURM_JOB_GPUS
  - export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

signal_delay_s: 120
max_num_timeout: 0
