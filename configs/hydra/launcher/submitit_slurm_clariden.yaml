# @package hydra.launcher
# CSCS Clariden. scripts/cluster/submit_*.sh --cluster clariden prepends this launcher and
# overrides hydra.launcher.timeout_min per catalogue.
defaults:
  - submitit_slurm

# Under the sweep directory: the submitit logs then sit beside the Hydra output of their run.
submitit_folder: ${hydra.sweep.dir}/.submitit/%j

account: a0166
qos: null

partition: normal
timeout_min: 720
cpus_per_task: 4
gpus_per_node: 1
tasks_per_node: 1
nodes: 1
mem_gb: 100 # the pooled k-fold tensors reach ~15 GB of host RAM at 150 constituents, before copies

array_parallelism: 96

name: ${hydra.job.name}

additional_parameters: {}
signal_delay_s: 120
max_num_timeout: 0
