_target_: lightning.pytorch.trainer.Trainer

default_root_dir: ${paths.output_dir}

# A floor of one epoch, so early stopping cannot end a run before any validation.
min_epochs: 1
max_epochs: 10

accelerator: cpu
devices: 1

check_val_every_n_epoch: 1

gradient_clip_val: 1.0

# LorentzNet aggregates its edge messages with index_add_, which is non-deterministic on
# CUDA; run-to-run reproducibility rests on seed_everything alone.
deterministic: False
