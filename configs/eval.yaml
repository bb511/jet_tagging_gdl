# @package _global_

defaults:
  - _self_
  - data: hls4ml
  - algorithm: deepsets
  - callbacks: default
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default
  - logger: none
  - experiment: null
  - optional local: default
  - debug: null

task_name: "eval"

tags: ["dev"]

experiment_name: jet_tagging_gdl_dev

run_name: ${short_hash:${hydra:runtime.output_dir},12}

# Single-checkpoint mode, ignored once checkpoint_manifest_path is set.
ckpt_path: null

# Manifest mode: the checkpoint_manifest.json train.py left in its run directory, every run of it
# tested in turn. A directory instead merges the main run's manifest there with the fold_<i>/ ones
# of folds trained as separate processes (fold=<i>).
checkpoint_manifest_path: null

# The manifest of the augmentation/none training of the same architecture and constituent count,
# a file or a run directory as above. Its runs are matched to this one's by fold label and scored
# on the same transformed batches, which is where the baseline_* and delta_* columns come from.
# Left null on a baseline run, and on LorentzNet, which is trained in the baseline regime alone
# and so has no baseline to compare with.
baseline_checkpoint_manifest_path: null

seed: 12345

# Logged so a train run and its later evaluation are distinguishable in MLflow.
run_stage: "eval"
