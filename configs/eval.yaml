# @package _global_

defaults:
  - _self_
  - data: hls4ml
  - algorithm: deepsets
  - callbacks: default
  - results_table: default
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default
  - logger: mlflow
  - experiment: null
  - optional local: default
  - debug: null

task_name: "eval"

