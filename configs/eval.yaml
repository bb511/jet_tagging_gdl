# @package _global_

defaults:
  - _self_
  - data: hls4ml
  - algorithm: deepsets
  - callbacks: default
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default
  - logger: none
  - experiment: null
  - optional local: default
  - debug: null

task_name: "eval"

tags: ["dev"]

experiment_name: jet_tagging_gdl_dev

run_name: ${short_hash:${hydra:runtime.output_dir},12}

# Single-checkpoint mode: evaluate exactly this checkpoint. Ignored once
# checkpoint_manifest_path is set.
ckpt_path: null

# Manifest mode: the checkpoint_manifest.json that train.py wrote, whose runs are all
# tested in turn. It sits in the training run's hydra.run.dir.
checkpoint_manifest_path: null

seed: 12345

# Logged so a train run and its later evaluation are distinguishable in MLflow.
run_stage: "eval"
