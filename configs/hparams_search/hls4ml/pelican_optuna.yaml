# @package _global_
# The PELICAN search with the beams, one TPE study per constituent count.

defaults:
  - /hparams_search/optuna

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/hls4ml/pelican.db?timeout=600
    study_name: pelican_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 200

    # Over (n_blocks, n_hidden, n_message), nanoPELICAN is (1, 3, 0) and the 11k point (5, 25, 15).
    params:
      algorithm.n_blocks: choice(1, 2, 3, 5)
      # Capped at 35 against the paper's 132, so that every point stays trigger-sized.
      algorithm.n_hidden: choice(3, 6, 10, 15, 25, 35)
      algorithm.n_message: choice(0, 6, 15, 35) # 0 drops the messaging MLP
      algorithm.dropout: choice(0.0, 0.025, 0.1)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 5e-3))
      # Up to 5e-3, since AdamW's decay is the paper's regulariser.
      algorithm.optimizer.weight_decay: choice(0.0, 1e-5, 1e-3, 5e-3)
