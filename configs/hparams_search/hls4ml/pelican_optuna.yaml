# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe
  - override /logger: none # a trial leaves only its study; MLflow is for the trainings

# One TPE study per nconstituents for PELICAN, three in all, on the main run's val/acc_best.
# PELICAN embeds the symmetry rather than acquiring it, so it is only ever trained in the
# baseline regime; the 200 trials match what the other architectures get, so the baselines are
# searched at equal effort. Paired on the CLI with callbacks=search data.n_folds=1.
# lorentz_eta_max is never searched: it defines the invariance probe and stays fixed.
hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/hls4ml/pelican.db?timeout=600
    # The regime alone picks the study, pelican_nconst<N>_augmentation_none, never the CLI.
    study_name: pelican_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_jobs: 1
    direction: maximize
    n_trials: 200
    sampler:
      seed: 1234
      n_startup_trials: 20

    # The space spans the published points from below: (n_blocks, n_hidden, n_message) = (1, 3, 0)
    # is nanoPELICAN and (5, 25, 15) the paper's 11k point. n_message=0 drops the messaging MLP
    # inside a block, leaving the equivariant layer normalised but unmixed, which is what makes
    # the nano corner reachable. The width is capped at 35 rather than the paper's 132, so every
    # point stays trigger-sized. lr and weight_decay follow JetFormer's ranges; AdamW's decay is
    # the paper's regulariser here, so it is searched up to 5e-3 rather than capped low.
    params:
      algorithm.n_blocks: choice(1, 2, 3, 5)
      algorithm.n_hidden: choice(3, 6, 10, 15, 25, 35)
      algorithm.n_message: choice(0, 6, 15, 35)
      algorithm.dropout: choice(0.0, 0.025, 0.1)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 5e-3))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-5, 1e-3, 5e-3)
