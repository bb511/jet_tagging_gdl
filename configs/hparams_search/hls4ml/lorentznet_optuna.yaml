# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe

# One TPE study per (nconstituents, method, augmentation_scheme) regime for
# LorentzNet. train.py returns the main run's clean val/acc_best (never a fold
# average, never an invariance metric: those are reported, not tuned on), and every
# regime shares this space and this 100-trial budget so the augmentation-vs-SCL
# comparison is not confounded by unequal search effort. Runs at data.n_folds=1 (set
# on the CLI, see scripts/hls4ml/*_search.sh) and callbacks=search, so trials draw no
# plots and never touch results/. lorentz_eta_max is not searched here or in the SCL
# variant: it defines the invariance probe and must stay fixed across regimes for the
# reported metric to mean the same thing everywhere.
hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/hls4ml/lorentznet.db?timeout=600
    # e.g. lorentznet_nconst16_augmentation_none (baseline) or
    # lorentznet_nconst16_symm_loss_so2 (SCL); the regime alone picks the study, so no
    # study name is passed on the CLI.
    study_name: lorentznet_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_jobs: 1
    direction: maximize
    n_trials: 100
    sampler:
      seed: 1234
      n_startup_trials: 20

    # n_hidden and n_layers bracket the paper's (72, 6) LGEB stack from below, since a
    # smaller graph net may already saturate accuracy on this task. c_weight scales
    # the Minkowski-coordinate update against the scalar-feature update in every LGEB
    # layer and is log-scaled because that trade-off is expected to matter across
    # orders of magnitude, not within one. lr and weight_decay follow JetFormer's
    # ranges (both are deeper, harder-to-stabilise nets than DeepSets/MLP), with
    # weight_decay capped lower to match LorentzNet's smaller parameter count.
    params:
      algorithm.n_hidden: choice(16, 24, 32, 48, 72)
      algorithm.n_layers: choice(2, 3, 4, 6)
      algorithm.c_weight: tag(log, interval(1e-4, 1e-1))
      algorithm.dropout: choice(0.0, 0.1, 0.2)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 5e-3))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5)
