# @package _global_
# The LorentzNet search, one TPE study per constituent count.

defaults:
  - /hparams_search/optuna

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/hls4ml/lorentznet.db?timeout=600
    study_name: lorentznet_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 200

    # n_hidden and n_layers bracket the paper's (72, 6) stack from below.
    params:
      algorithm.n_hidden: choice(16, 24, 32, 48, 72)
      algorithm.n_layers: choice(2, 3, 4, 6)
      # Up to 1, where the tanh-gated step moves a node by a whole mean edge difference per block.
      algorithm.c_weight: tag(log, interval(1e-4, 1))
      algorithm.dropout: choice(0.0, 0.1, 0.2)
      # lr and weight_decay take JetFormer's ranges, the decay capped lower for the smaller net.
      algorithm.optimizer.lr: tag(log, interval(1e-4, 5e-3))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5)
