# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe
  - override /logger: none # a trial leaves only its study; MLflow is for the trainings

# One TPE study per (nconstituents, method, augmentation_scheme) regime for JetFormer, on the main
# run's val/acc_best. Every regime shares this space and its 200 trials, so augmentation and SCL are
# searched at equal effort. Paired on the CLI with callbacks=search data.n_folds=1.
hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/hls4ml/jetformer.db?timeout=600
    # The regime alone picks the study, e.g. jetformer_nconst16_symm_loss_so2; never a CLI argument.
    study_name: jetformer_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_jobs: 1
    direction: maximize
    n_trials: 200
    sampler:
      seed: 1234
      n_startup_trials: 20

    # Every embed_dim is divisible by every num_heads on offer. lr is capped below DeepSets/MLP's,
    # since attention and LayerNorm diverge more readily; weight_decay reaches higher, following the
    # heavier AdamW regularisation typical of attention models.
    params:
      algorithm.embed_dim: choice(16, 32, 48, 64, 96)
      algorithm.num_heads: choice(1, 2, 4)
      algorithm.num_transformers: choice(1, 2, 3, 4)
      algorithm.dropout: choice(0.0, 0.1, 0.2)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 5e-3))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-4, 1e-3, 1e-2, 5e-2)
