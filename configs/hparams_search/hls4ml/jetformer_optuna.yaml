# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe

# One TPE study per (nconstituents, method, augmentation_scheme) regime for JetFormer.
# train.py returns the main run's clean val/acc_best (never a fold average, never an
# invariance metric: those are reported, not tuned on), and every regime shares this
# space and this 100-trial budget so the augmentation-vs-SCL comparison is not
# confounded by unequal search effort. Runs at data.n_folds=1 (set on the CLI, see
# scripts/hls4ml/*_search.sh) and callbacks=search, so trials draw no plots and never
# touch results/.
hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/hls4ml/jetformer.db?timeout=600
    # e.g. jetformer_nconst16_augmentation_none (baseline) or
    # jetformer_nconst16_symm_loss_so2 (SCL); the regime alone picks the study, so no
    # study name is passed on the CLI.
    study_name: jetformer_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_jobs: 1
    direction: maximize
    n_trials: 100
    sampler:
      seed: 1234
      n_startup_trials: 20

    # embed_dim, num_heads and num_transformers cover shallow and deep encoders
    # (embed_dim always divisible by every num_heads choice on offer). The lr ceiling
    # is lower than DeepSets/MLP's because attention and LayerNorm are more prone to
    # diverge at a high learning rate; weight_decay is searched to a higher ceiling,
    # following the heavier AdamW regularisation typical of attention models.
    params:
      algorithm.embed_dim: choice(16, 32, 48, 64, 96)
      algorithm.num_heads: choice(1, 2, 4)
      algorithm.num_transformers: choice(1, 2, 3, 4)
      algorithm.dropout: choice(0.0, 0.1, 0.2)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 5e-3))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-4, 1e-3, 1e-2, 5e-2)
