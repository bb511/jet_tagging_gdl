# @package _global_
# The JetFormer search, one TPE study per regime.

defaults:
  - /hparams_search/optuna

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/hls4ml/jetformer.db?timeout=600
    study_name: jetformer_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 200

    params:
      algorithm.embed_dim: choice(16, 32, 48, 64, 96) # each divisible by every num_heads
      algorithm.num_heads: choice(1, 2, 4)
      algorithm.num_transformers: choice(1, 2, 3, 4)
      algorithm.dropout: choice(0.0, 0.1, 0.2)
      # Capped below DeepSets', since attention and LayerNorm diverge more readily.
      algorithm.optimizer.lr: tag(log, interval(1e-4, 5e-3))
      # Heavier than DeepSets', as is usual for AdamW on attention models.
      algorithm.optimizer.weight_decay: choice(0.0, 1e-4, 1e-3, 1e-2, 5e-2)
