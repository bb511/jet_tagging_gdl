# @package _global_
# The search of JEDI-linear with the jet moments, one TPE study per constituent count.

defaults:
  - /hparams_search/optuna

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/hls4ml/jedi_linear_moments.db?timeout=600
    study_name: jedi_linear_moments_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 200

    # jedi_linear_optuna.yaml's space plus the moment set, so that the rows differ in it alone.
    params:
      algorithm.hidden: choice(16, 32, 64, 128)
      algorithm.head_layers: choice([16], [32], [32,16], [32,32,16], [64,32], [64,32,16])
      algorithm.aggregation: choice(sum, max, sum_over_n)
      algorithm.moments: choice(uniform, rankcut)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 1e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5, 1e-4)
