# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe
  - override /logger: none # a trial leaves only its study; MLflow is for the trainings

# The cheap family of the vector neurons at 16 constituents: one block with neither gate nor
# stream, the shape the latency ablation of vn_hgq converged on. The control of
# vn_cheap_axis_optuna.yaml, which adds the leader's offset from the full jet's axis and nothing
# else. Both studies live in vn_cheap.db, apart from the full-space studies of vn.db, and the
# regime names them. Paired on the CLI with callbacks=search data.n_folds=1.
algorithm:
  num_blocks: 1
  gate: false
  stream_channels: 0
  dropout: 0.0

hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/hls4ml/vn_cheap.db?timeout=600
    study_name: vn_cheap_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_jobs: 1
    direction: maximize
    n_trials: 200
    sampler:
      seed: 1234
      n_startup_trials: 20

    # lr and weight_decay reach past the bounds of the full-space study, whose bests sat at
    # their top edges (lr 4.99e-3 of 5e-3, weight decay 0.05 the largest choice).
    params:
      algorithm.vector_channels: choice(8, 16, 32)
      algorithm.scalar_channels: choice(32, 64, 128)
      algorithm.invariants: choice(8, 16, 32)
      algorithm.tensor_invariants: choice(0, 1, 2, 4)
      algorithm.mlp_layers: choice(1, 2)
      algorithm.head_layers: choice([16], [32], [64,32])
      algorithm.optimizer.lr: tag(log, interval(1e-4, 1e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-3, 1e-2, 5e-2, 1e-1)
