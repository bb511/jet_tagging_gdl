# @package _global_
# The search of the boosted trees on all 53 jet-level observables, one TPE study at N = 150.

defaults:
  - /hparams_search/optuna

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/hls4ml/jet_level_bdt_all53.db?timeout=600
    study_name: jet_level_bdt_all53_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 200

    # One space for both BDT rows, which tests/test_configs.py keeps equal.
    params:
      algorithm.learning_rate: tag(log, interval(0.01, 0.3))
      algorithm.max_leaf_nodes: choice(15, 31, 63, 127, 255)
      algorithm.max_depth: choice(0, 6, 12) # 0 for no limit: the sweeper writes None as 'None'
      algorithm.min_samples_leaf: choice(20, 100, 500)
      algorithm.l2_regularization: choice(0.0, 0.1, 1.0)
      algorithm.max_features: choice(0.5, 1.0)
