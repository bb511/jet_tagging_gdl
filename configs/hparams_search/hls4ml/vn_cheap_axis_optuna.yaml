# @package _global_
# vn_cheap_optuna.yaml plus the leader's offset from the full jet's axis as two more scalars.

defaults:
  - /hparams_search/optuna

algorithm:
  num_blocks: 1
  gate: false
  stream_channels: 0
  dropout: 0.0
  axis_offset: true
  nbr_feats: 5

data:
  full_axis: true
  features: [pt, eta, phi, etarel, phirel]

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/hls4ml/vn_cheap.db?timeout=600
    study_name: vn_cheap_axis_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 200

    # vn_cheap_optuna.yaml's space, which tests/test_configs.py keeps equal.
    params:
      algorithm.vector_channels: choice(8, 16, 32)
      algorithm.scalar_channels: choice(32, 64, 128)
      algorithm.invariants: choice(8, 16, 32)
      algorithm.tensor_invariants: choice(0, 1, 2, 4)
      algorithm.mlp_layers: choice(1, 2)
      algorithm.head_layers: choice([16], [32], [64,32])
      algorithm.optimizer.lr: tag(log, interval(1e-4, 1e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-3, 1e-2, 5e-2, 1e-1)
