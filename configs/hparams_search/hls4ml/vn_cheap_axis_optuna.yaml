# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe
  - override /logger: none # a trial leaves only its study; MLflow is for the trainings

# vn_cheap_optuna.yaml with the leader's eta and phi from the full jet's axis as two more scalars
# of the first block, read off the record's own etarel and phirel (data.full_axis): the test of
# what that axis is worth to the cheap vector neurons. tests/test_configs.py keeps the sweeper
# equal to the control's but for the study name.
algorithm:
  num_blocks: 1
  gate: false
  stream_channels: 0
  dropout: 0.0
  axis_offset: true
  nbr_feats: 5

data:
  full_axis: true
  features: [pt, eta, phi, etarel, phirel]

hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/hls4ml/vn_cheap.db?timeout=600
    study_name: vn_cheap_axis_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_jobs: 1
    direction: maximize
    n_trials: 200
    sampler:
      seed: 1234
      n_startup_trials: 20

    params:
      algorithm.vector_channels: choice(8, 16, 32)
      algorithm.scalar_channels: choice(32, 64, 128)
      algorithm.invariants: choice(8, 16, 32)
      algorithm.tensor_invariants: choice(0, 1, 2, 4)
      algorithm.mlp_layers: choice(1, 2)
      algorithm.head_layers: choice([16], [32], [64,32])
      algorithm.optimizer.lr: tag(log, interval(1e-4, 1e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-3, 1e-2, 5e-2, 1e-1)
