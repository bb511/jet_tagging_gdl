# @package _global_
# The search of LLoCa with the Lorentz frames, one TPE study per constituent count.

defaults:
  - /hparams_search/optuna

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/hls4ml/lloca_lorentz.db?timeout=600
    study_name: lloca_lorentz_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 200

    # Holds the references' default: 8 blocks, 8 heads of 8x0n+2x1n, mlp_factor 2, frames-net 32.
    params:
      algorithm.num_blocks: choice(2, 4, 6, 8, 12)
      algorithm.num_heads: choice(2, 4, 8)
      algorithm.attn_scalars: choice(4, 8)
      algorithm.attn_vectors: choice(1, 2)
      algorithm.mlp_factor: choice(2, 4)
      algorithm.dropout: choice(0.0, 0.1, 0.2)
      algorithm.framesnet_hidden: choice(16, 32, 64)
      # lr and weight_decay take JetFormer's ranges.
      algorithm.optimizer.lr: tag(log, interval(1e-4, 5e-3))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-4, 1e-3, 1e-2, 5e-2)
