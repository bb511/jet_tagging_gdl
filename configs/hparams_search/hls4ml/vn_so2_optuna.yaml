# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe
  - override /logger: none # a trial leaves only its study; MLflow is for the trainings

# One TPE study per nconstituents for the vector neurons with the SO(2) partition, three in
# all, on the main run's val/acc_best, in the baseline regime alone like every embedded
# architecture. The two vn rows share the space, so they are searched at equal effort, and the
# space is provisional until the campaign discussion. Paired on the CLI with callbacks=search
# data.n_folds=1. units is a numerical setting, not model capacity, symmetry is the row itself, and
# lorentz_eta_max defines the invariance probe, so none of the three is searched.
hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/hls4ml/vn_so2.db?timeout=600
    # The regime picks the study, vn_so2_nconst<N>_augmentation_none, never the CLI.
    study_name: vn_so2_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_jobs: 1
    direction: maximize
    n_trials: 200
    sampler:
      seed: 1234
      n_startup_trials: 20

    # The default (3 blocks, 16 vector and 64 scalar channels, 16 invariants) lies inside the
    # space. Every block runs once per jet, not once per constituent, so the corner (6 blocks, 64
    # vector and 128 scalar channels, 32 invariants, head [128, 64]) costs 1.1 to 1.6 MFLOP per
    # jet at 0.45 to 0.73 M parameters (measured on 2026-09-29), below the defaults of PELICAN
    # (4.5 MFLOP at 16 constituents), LLoCa (34) and L-GATr-slim (97 to 114). 64 vector channels
    # make the first layer lossless at 16 and 50 constituents and a compression at 150. lr and
    # weight_decay follow the ranges of L-GATr-slim and LLoCa, whose optimiser block this is.
    params:
      algorithm.num_blocks: choice(1, 2, 3, 4, 6)
      algorithm.vector_channels: choice(8, 16, 32, 64)
      algorithm.scalar_channels: choice(32, 64, 128)
      algorithm.invariants: choice(8, 16, 32)
      algorithm.head_layers: choice([32], [64,32], [128,64])
      algorithm.dropout: choice(0.0, 0.1, 0.2)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 5e-3))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-4, 1e-3, 1e-2, 5e-2)
