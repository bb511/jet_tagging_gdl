# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe
  - override /logger: none # a trial leaves only its study; MLflow is for the trainings

# One TPE study per nconstituents for LLoCa with the SO(3) frames, three in all, on the main
# run's val/acc_best, in the baseline regime alone like every embedded architecture. The four
# LLoCa rows share the space, so they are searched at equal effort, and the space is provisional
# until the campaign discussion. Paired on the CLI with callbacks=search data.n_folds=1. units
# and mass_reg are numerical settings, not model capacity, and lorentz_eta_max defines the
# invariance probe, so none of the three is searched.
hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/hls4ml/lloca_so3.db?timeout=600
    # The regime picks the study, lloca_so3_nconst<N>_augmentation_none, never the CLI.
    study_name: lloca_so3_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_jobs: 1
    direction: maximize
    n_trials: 200
    sampler:
      seed: 1234
      n_startup_trials: 20

    # The references' tagging default (8 blocks, 8 heads, 8x0n+2x1n per head, mlp_factor 2,
    # frames-net hidden 32) lies inside the space. lr and weight_decay follow JetFormer's ranges,
    # the transformer of this study.
    params:
      algorithm.num_blocks: choice(2, 4, 6, 8, 12)
      algorithm.num_heads: choice(2, 4, 8)
      algorithm.attn_scalars: choice(4, 8, 16)
      algorithm.attn_vectors: choice(1, 2, 4)
      algorithm.mlp_factor: choice(2, 4)
      algorithm.dropout: choice(0.0, 0.1, 0.2)
      algorithm.framesnet_hidden: choice(16, 32, 64)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 5e-3))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-4, 1e-3, 1e-2, 5e-2)
