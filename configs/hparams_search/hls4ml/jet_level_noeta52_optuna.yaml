# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe
  - override /logger: none # a trial leaves only its study; MLflow is for the trainings

# One TPE study for the MLP on the jet-level observables, labelled nconst150, on the main run's
# val/acc_best, in the baseline regime alone. Paired on the CLI with callbacks=search
# data.n_folds=1.
hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/hls4ml/jet_level_noeta52.db?timeout=600
    # The regime picks the study, jet_level_noeta52_nconst150_augmentation_none, never the CLI.
    study_name: jet_level_noeta52_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_jobs: 1
    direction: maximize
    n_trials: 200
    sampler:
      seed: 1234
      n_startup_trials: 20

    # The space and the trial budget of mlp_optuna.yaml, which tests/test_configs.py keeps equal, so
    # that the ceiling and the constituent MLP are tuned alike. The widest point, [256, 128, 64], is
    # the one the scratch run of 2026-10-05 selected on these observables.
    params:
      algorithm.hidden_layers: choice([32,16], [64,32], [64,64,32], [128,64,32], [128,128,64], [256,128,64])
      algorithm.batchnorm: choice(true, false)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 1e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5, 1e-4)
