# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe
  - override /logger: none # a trial leaves only its study; MLflow is for the trainings

# One TPE study per (nconstituents, method, augmentation_scheme) regime for the MLP, on the main
# run's val/acc_best. Every regime shares this space and its 200 trials, so augmentation and SCL are
# searched at equal effort. Paired on the CLI with callbacks=search data.n_folds=1.
hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/hls4ml/mlp.db?timeout=600
    # The regime alone picks the study, e.g. mlp_nconst16_symm_loss_so2; never a CLI argument.
    study_name: mlp_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_jobs: 1
    direction: maximize
    n_trials: 200
    sampler:
      seed: 1234
      n_startup_trials: 20

    # hidden_layers reach four times the tuned nconst=16 width, since the flattened input grows with
    # N (600 columns at N=150) and no inductive bias compensates. batchnorm: the padded zero rows
    # shift the per-batch statistics it normalises against, for better or worse; it folds into the
    # dense layers at inference. The activation stays at the algorithm's ReLU, since GELU and SiLU
    # cost an FPGA a lookup table and a multiplier per unit.
    params:
      algorithm.hidden_layers: choice([32,16], [64,32], [64,64,32], [128,64,32], [128,128,64], [256,128,64])
      algorithm.batchnorm: choice(true, false)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 1e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5, 1e-4)
