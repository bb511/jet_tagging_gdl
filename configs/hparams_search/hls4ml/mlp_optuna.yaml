# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe

# One TPE study per (nconstituents, method, augmentation_scheme) regime for the MLP.
# train.py returns the main run's clean val/acc_best (never a fold average, never an
# invariance metric: those are reported, not tuned on), and every regime shares this
# space and this 100-trial budget so the augmentation-vs-SCL comparison is not
# confounded by unequal search effort. Runs at data.n_folds=1 (set on the CLI, see
# scripts/hls4ml/*_search.sh) and callbacks=search, so trials draw no plots and never
# touch results/.
hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/hls4ml/mlp.db?timeout=600
    # e.g. mlp_nconst16_augmentation_none (baseline) or mlp_nconst16_symm_loss_so2
    # (SCL); the regime alone picks the study, so no study name is passed on the CLI.
    study_name: mlp_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_jobs: 1
    direction: maximize
    n_trials: 100
    sampler:
      seed: 1234
      n_startup_trials: 20

    # hidden_layers spans the tuned nconst=16/32 width up to a net four times wider,
    # since the flattened input grows with nconstituents (600 at N=150) while the MLP
    # keeps no architectural inductive bias to compensate. batchnorm is searched
    # because the padded, zero-valued constituent rows shift the per-batch statistics
    # it normalises against, and it is not obvious a priori whether that helps or
    # hurts a flat classifier.
    params:
      algorithm.hidden_layers: choice([32,16], [64,32], [64,64,32], [128,64,32], [128,128,64], [256,128,64])
      algorithm.batchnorm: choice(true, false)
      algorithm.activation: choice(relu, gelu, silu)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 1e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5, 1e-4)
