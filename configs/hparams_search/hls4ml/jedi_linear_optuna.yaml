# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe
  - override /logger: none # a trial leaves only its study; MLflow is for the trainings

# One TPE study per nconstituents for JEDI-linear, three per feature set, on the main run's
# val/acc_best, in the baseline regime alone: a comparator from the literature is not a subject of
# the augmentation-against-SCL grid, so there is no _scl_optuna config. Paired on the CLI with
# callbacks=search data.n_folds=1; a feature set other than the four-momentum also sets
# hydra.sweeper.storage, as its catalogue blocks do.
hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/hls4ml/jedi_linear.db?timeout=600
    # The regime picks the study, jedi_linear_nconst<N>_augmentation_none, never the CLI.
    study_name: jedi_linear_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_jobs: 1
    direction: maximize
    n_trials: 200
    sampler:
      seed: 1234
      n_startup_trials: 20

    # The published point (hidden 64, head [64, 32, 16], ReLU, sum) lies inside the space. The
    # activation, the pooling, lr and weight_decay are searched over the choices of the DeepSets
    # search, whose optimiser block this is, so that the two rows differ in the network alone; the
    # head choices are the DeepSets rho choices plus the published head. A first campaign with the
    # pooling fixed to the sum (2026-09-30, stopped and removed) fell 8 to 14 points behind
    # DeepSets on [px, py, pz, e] and [pt, eta, phi], where the best DeepSets trials took the
    # maximum. The corner (hidden 128, head [64, 32, 16]) has
    # 61 125 parameters on four features and costs 1.1, 3.4 and 10.0 MFLOP per jet at 16, 50 and
    # 150 constituents, against 0.29, 0.87 and 2.56 at the published point.
    params:
      algorithm.hidden: choice(16, 32, 64, 128)
      algorithm.head_layers: choice([16], [32], [32,16], [32,32,16], [64,32], [64,32,16])
      algorithm.activation: choice(relu, tanh)
      algorithm.aggregation: choice(sum, mean, max)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 1e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5, 1e-4)
