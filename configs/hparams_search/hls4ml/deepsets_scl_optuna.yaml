# @package _global_

# The SCL regimes (data.method=symm_loss) add the consistency-loss weight to deepsets_optuna.yaml.
defaults:
  - hls4ml/deepsets_optuna
  - _self_

hydra:
  sweeper:
    params:
      # Weighs the consistency term against the cross-entropy: log-scaled, from a light regulariser
      # (1e-3) to dominating the total loss (10).
      algorithm.symm_loss_weight: tag(log, interval(1e-3, 10))
