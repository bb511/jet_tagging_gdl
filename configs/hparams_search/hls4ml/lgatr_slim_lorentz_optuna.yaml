# @package _global_
# The L-GATr-slim search without the spurion tokens, one TPE study per constituent count.

defaults:
  - /hparams_search/optuna

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/hls4ml/lgatr_slim_lorentz.db?timeout=600
    study_name: lgatr_slim_lorentz_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 200

    # lgatr_slim_optuna.yaml's space, so that the two rows are searched alike.
    params:
      algorithm.num_blocks: choice(2, 4, 6, 8, 12)
      algorithm.hidden_v_channels: choice(8, 16, 32)
      algorithm.hidden_s_channels: choice(32, 64, 96)
      algorithm.num_heads: choice(2, 4, 8)
      algorithm.mlp_ratio: choice(2, 4)
      algorithm.dropout: choice(0.0, 0.1, 0.2)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 5e-3))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-4, 1e-3, 1e-2, 5e-2)
