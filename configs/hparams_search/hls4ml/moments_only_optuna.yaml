# @package _global_

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe
  - override /logger: none # a trial leaves only its study; MLflow is for the trainings

# One TPE study per nconstituents for the moments-only control, three in all, on the main run's
# val/acc_best, in the baseline regime alone like every embedded row. Paired on the CLI with
# callbacks=search data.n_folds=1.
hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/hls4ml/moments_only.db?timeout=600
    # The regime picks the study, moments_only_nconst<N>_augmentation_none, never the CLI.
    study_name: moments_only_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_jobs: 1
    direction: maximize
    n_trials: 200
    sampler:
      seed: 1234
      n_startup_trials: 20

    # The space of deepsets_optuna.yaml without the per-constituent network and its pooling, which
    # the control does not have, and the moment set: the five moments of every real constituent
    # (uniform) or those and the moments of the leading 1, 2, 4 and 8 by p_T (rankcut). The corner
    # (rho [64, 32], rankcut) has 4023 parameters and costs 0.45, 0.73 and 1.57 M eBOPs per jet at
    # 16, 50 and 150 constituents, against 1903 parameters and 0.17, 0.24 and 0.47 M eBOPs at the
    # algorithm defaults (measured on 2026-10-05). eBOPs rather than FLOPs: the FLOP counter prices
    # matrix products alone and misses the elementwise products of the moments.
    params:
      algorithm.rho_layers: choice([16], [32], [32,16], [32,32,16], [64,32])
      algorithm.moments: choice(uniform, rankcut)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 1e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5, 1e-4)
