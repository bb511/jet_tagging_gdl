# @package _global_
# The search of the moments-only control, one TPE study per constituent count.

defaults:
  - /hparams_search/optuna

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/hls4ml/moments_only.db?timeout=600
    study_name: moments_only_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 200

    # deepsets_optuna.yaml's space without phi and its pool, plus the moment set.
    params:
      algorithm.rho_layers: choice([16], [32], [32,16], [32,32,16], [64,32])
      algorithm.moments: choice(uniform, rankcut)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 1e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5, 1e-4)
