# @package _global_
# The Linformer search, one TPE study per regime.

defaults:
  - /hparams_search/optuna

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/hls4ml/linformer.db?timeout=600
    study_name: linformer_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 200

    # One block and one head, as in arXiv:2510.24784 and its authors' example.
    params:
      algorithm.embed_dim: choice(16, 24, 32, 48, 64)
      algorithm.kv_proj_dim: choice(2, 4, 8) # the paper's 2 and the example's 4
      algorithm.ff_dim: choice(16, 32, 64, 128)
      algorithm.head_layers: choice([16], [32], [32,16], [32,32,16], [64,32], [32,32,32])
      algorithm.aggregation: choice(sum, max, sum_over_n)
      algorithm.batchnorm: choice(true, false)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 1e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5, 1e-4)
