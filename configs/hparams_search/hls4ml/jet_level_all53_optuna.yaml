# @package _global_
# The search of the MLP on all 53 jet-level observables, one TPE study at N = 150.

defaults:
  - /hparams_search/optuna

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/hls4ml/jet_level_all53.db?timeout=600
    study_name: jet_level_all53_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 200

    # mlp_optuna.yaml's space and budget, which tests/test_configs.py keeps equal.
    params:
      algorithm.hidden_layers: choice([32,16], [64,32], [64,64,32], [128,64,32], [128,128,64], [256,128,64])
      algorithm.batchnorm: choice(true, false)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 1e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5, 1e-4)
