# @package _global_
# The search of DeepSets with the jet moments, one TPE study per constituent count.

defaults:
  - /hparams_search/optuna

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/hls4ml/deepsets_moments.db?timeout=600
    study_name: deepsets_moments_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 200

    # deepsets_optuna.yaml's space plus the moment set, so that the rows differ in it alone.
    params:
      algorithm.phi_layers: choice([16,16], [32,32], [32,32,32], [64,32,32], [64,64,32], [64,64,64], [128,64,32])
      algorithm.rho_layers: choice([16], [32], [32,16], [32,32,16], [64,32])
      algorithm.aggregation: choice(sum, max, sum_over_n)
      algorithm.moments: choice(uniform, rankcut)
      algorithm.optimizer.lr: tag(log, interval(1e-4, 1e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5, 1e-4)
