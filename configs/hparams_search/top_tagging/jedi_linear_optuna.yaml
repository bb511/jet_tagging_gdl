# @package _global_
# The JEDI-linear search at N = 100, one space for its three feature sets and seven regimes.

defaults:
  - /hparams_search/optuna

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/top_tagging/jedi_linear.db?timeout=600
    study_name: top_tagging_jedi_linear_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 100

    # Each size from the hls4ml step below the smallest N = 150 optimum to one step past the grid.
    params:
      algorithm.hidden: choice(32, 64, 128, 256)
      algorithm.head_layers: choice([16], [32], [32,16], [32,32,16], [64,32], [64,32,16], [128,64,32])
      algorithm.aggregation: choice(sum, max, sum_over_n)
      # A factor 3 beyond the extremes of the hls4ml optima.
      algorithm.optimizer.lr: tag(log, interval(3.62e-4, 2.96e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5, 1e-4)
