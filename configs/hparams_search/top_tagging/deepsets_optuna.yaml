# @package _global_
# The DeepSets search at N = 100, one space for its three feature sets and seven regimes.

defaults:
  - /hparams_search/optuna

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/top_tagging/deepsets.db?timeout=600
    study_name: top_tagging_deepsets_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 100

    # Each size from the hls4ml step below the smallest N = 150 optimum to one step past the grid.
    params:
      algorithm.phi_layers: choice([32,32,32], [64,32,32], [64,64,32], [64,64,64], [128,64,32], [128,128,64])
      algorithm.rho_layers: choice([16], [32], [32,16], [32,32,16], [64,32], [128,64])
      algorithm.aggregation: choice(sum, max, sum_over_n)
      # A factor 3 beyond the extremes of the hls4ml optima.
      algorithm.optimizer.lr: tag(log, interval(7.01e-4, 2.98e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5, 1e-4)
