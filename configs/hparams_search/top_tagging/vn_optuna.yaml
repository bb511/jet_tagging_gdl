# @package _global_
# The top-tagging search at N = 100: the hls4ml space of this name narrowed around its N = 150
# optimum, each size to that value and its grid neighbours, the lr to a factor 3, the rest kept.

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe
  - override /logger: none # a trial leaves only its study; MLflow is for the trainings

# One TPE study on the main run's val/acc_best, paired on the CLI with callbacks=search
# data.n_folds=1 trainer.max_epochs=50. A campaign enqueues the optimum, the values of the
# experiment of this name, as trial 0 under these parameter names.
hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/top_tagging/vn.db?timeout=600
    # The regime alone picks the study, never a CLI argument.
    study_name: top_tagging_vn_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_jobs: 1
    direction: maximize
    n_trials: 100
    sampler:
      seed: 1234
      n_startup_trials: 20

    params:
      algorithm.num_blocks: choice(2, 3)
      algorithm.vector_channels: choice(16, 32)
      algorithm.scalar_channels: choice(32, 64)
      algorithm.invariants: choice(16, 32)
      algorithm.tensor_invariants: choice(1, 2, 4)
      algorithm.stream_channels: choice(16, 32)
      algorithm.head_layers: choice([32], [64,32])
      algorithm.dropout: choice(0.0, 0.1, 0.2)
      algorithm.optimizer.lr: tag(log, interval(1.65e-3, 1.47e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-4, 1e-3, 1e-2, 5e-2)
