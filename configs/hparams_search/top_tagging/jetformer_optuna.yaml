# @package _global_
# The JetFormer search at N = 100, one space for its three feature sets and seven regimes.

defaults:
  - /hparams_search/optuna

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/top_tagging/jetformer.db?timeout=600
    study_name: top_tagging_jetformer_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 100

    # Each size from the hls4ml step below the smallest N = 150 optimum to one step past the grid.
    params:
      algorithm.embed_dim: choice(32, 48, 64, 96, 128)
      algorithm.num_heads: choice(1, 2, 4, 8)
      algorithm.num_transformers: choice(2, 3, 4, 5)
      algorithm.dropout: choice(0.0, 0.1, 0.2)
      # A factor 3 beyond the extremes of the hls4ml optima.
      algorithm.optimizer.lr: tag(log, interval(1.91e-4, 1.40e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-4, 1e-3, 1e-2, 5e-2)
