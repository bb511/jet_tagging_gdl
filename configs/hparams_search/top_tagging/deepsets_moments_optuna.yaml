# @package _global_
# The top-tagging search at N = 100 around the row's hls4ml optimum at N = 150: each size runs from
# the hls4ml step below the optimum's value, if any, to one step beyond the hls4ml grid, the lr a
# factor 3 either side, and every other key over its hls4ml choices. The step beyond answers the
# studies of 2026-10-09, narrowed to the optimum's neighbours, whose best trial sat at the upper
# edge of a size in five of nine rows.

defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe
  - override /logger: none # a trial leaves only its study; MLflow is for the trainings

# One TPE study on the main run's val/acc_best, paired on the CLI with callbacks=search
# data.n_folds=1 trainer.max_epochs=50. A campaign enqueues the optimum, the values of the
# experiment of this name, as trial 0 under these parameter names.
hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: sqlite:///logs/optuna/top_tagging/deepsets_moments.db?timeout=600
    # The regime alone picks the study, never a CLI argument.
    study_name: top_tagging_deepsets_moments_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_jobs: 1
    direction: maximize
    n_trials: 100
    sampler:
      seed: 1234
      n_startup_trials: 20

    params:
      algorithm.phi_layers: choice([64,64,32], [64,64,64], [128,64,32], [128,128,64])
      algorithm.rho_layers: choice([32,32,16], [64,32], [128,64])
      algorithm.aggregation: choice(sum, max, sum_over_n)
      algorithm.moments: choice(uniform, rankcut)
      algorithm.optimizer.lr: tag(log, interval(9.31e-4, 8.38e-3))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5, 1e-4)
