# @package _global_
# The search of the moments-only control at N = 100 around its hls4ml optimum at N = 150.

defaults:
  - /hparams_search/optuna

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/top_tagging/moments_only.db?timeout=600
    study_name: top_tagging_moments_only_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 100

    # Each size from the hls4ml step below the optimum to one step past the hls4ml grid.
    params:
      algorithm.rho_layers: choice([32,32,16], [64,32], [128,64])
      algorithm.moments: choice(uniform, rankcut)
      # A factor 3 either side of the optimum.
      algorithm.optimizer.lr: tag(log, interval(1.82e-3, 1.64e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5, 1e-4)
