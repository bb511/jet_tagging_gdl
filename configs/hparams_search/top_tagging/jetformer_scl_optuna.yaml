# @package _global_

# The SCL regimes add the consistency-loss weight to jetformer_optuna.yaml, as on hls4ml.
defaults:
  - top_tagging/jetformer_optuna
  - _self_

hydra:
  sweeper:
    params:
      # From a light regulariser (1e-3) to dominating the total loss (10).
      algorithm.symm_loss_weight: tag(log, interval(1e-3, 10))
