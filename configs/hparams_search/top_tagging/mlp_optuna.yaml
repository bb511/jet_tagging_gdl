# @package _global_
# The MLP search at N = 100, one space for its three feature sets and seven regimes.

defaults:
  - /hparams_search/optuna

hydra:
  sweeper:
    storage: sqlite:///logs/optuna/top_tagging/mlp.db?timeout=600
    study_name: top_tagging_mlp_nconst${data.nconstituents}_${data.method}_${data.augmentation_scheme}
    n_trials: 100

    # Each size from the hls4ml step below the smallest N = 150 optimum to one step past the grid.
    params:
      algorithm.hidden_layers: choice([64,64,32], [128,64,32], [128,128,64], [256,128,64], [256,256,128])
      algorithm.batchnorm: choice(true, false)
      # A factor 3 beyond the extremes of the hls4ml optima.
      algorithm.optimizer.lr: tag(log, interval(4.49e-5, 2.77e-2))
      algorithm.optimizer.weight_decay: choice(0.0, 1e-7, 1e-6, 1e-5, 1e-4)
