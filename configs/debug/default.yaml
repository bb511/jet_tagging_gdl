# @package _global_

# One full epoch on the CPU, with callbacks, logger and results table off.

task_name: "debug" # keeps these logs out of logs/train/

callbacks: null # nothing is checkpointed, so the manifest train.py writes is empty
logger: null
results_table: null

extras:
  enforce_tags: False

hydra:
  job_logging:
    root:
      level: DEBUG

trainer:
  max_epochs: 1
  accelerator: cpu # a debugger cannot step through a GPU kernel
  devices: 1 # one process, which is as far as a debugger follows
  detect_anomaly: true

data:
  num_workers: 0 # the main process alone, for the debugger
  pin_memory: False
  n_folds: 1
