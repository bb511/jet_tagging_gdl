# @package _global_

# One full epoch on the CPU, with the callbacks and the loggers switched off. The other
# debug configs inherit from this one.

# Debug runs keep their logs out of logs/train/.
task_name: "debug"

# No checkpoints are written without the callbacks, so train.py records an empty manifest
# and eval.py has nothing to read; that is intended for a debug run.
callbacks: null
logger: null

extras:
  ignore_warnings: False
  enforce_tags: False

# https://hydra.cc/docs/tutorials/basic/running_your_app/logging/
hydra:
  job_logging:
    root:
      level: DEBUG

trainer:
  max_epochs: 1
  accelerator: cpu # debuggers do not like gpus
  devices: 1 # debuggers do not like multiprocessing
  detect_anomaly: true # raise on a NaN or an infinity in any tensor

data:
  num_workers: 0 # debuggers do not like multiprocessing
  pin_memory: False
  # One split rather than the experiment's five, so a debug run fits one model, not six.
  n_folds: 1
