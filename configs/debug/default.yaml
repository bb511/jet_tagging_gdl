# @package _global_

# One full epoch on the CPU, callbacks and loggers off. The other debug configs inherit from this.

task_name: "debug" # keeps these logs out of logs/train/

# Without the callbacks nothing is checkpointed, so the manifest train.py writes is empty.
callbacks: null
logger: null

extras:
  ignore_warnings: False
  enforce_tags: False

# https://hydra.cc/docs/tutorials/basic/running_your_app/logging/
hydra:
  job_logging:
    root:
      level: DEBUG

trainer:
  max_epochs: 1
  accelerator: cpu # debuggers do not like gpus
  devices: 1 # debuggers do not like multiprocessing
  detect_anomaly: true # raise on a NaN or an infinity in any tensor

data:
  num_workers: 0 # debuggers do not like multiprocessing
  pin_memory: False
  n_folds: 1 # one split, so a debug run fits one model rather than the experiment's six
