# @package callbacks

# Lightning's built-ins alone: a trial draws no plots and writes no results row.
defaults:
  - util@model_checkpoint: model_checkpoint
  - util@early_stopping: early_stopping
  - util@lr_monitor: lr_monitor
  - util@model_summary: model_summary
  - util@rich_progress_bar: rich_progress_bar
  - _self_

model_checkpoint:
  save_last: false # the tuned model is refit from the catalogue
