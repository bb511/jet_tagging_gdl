# @package callbacks

# Callbacks of the quantised rows, which keep the last epoch unless a block keeps every epoch.
defaults:
  - util@model_checkpoint: model_checkpoint
  - util@model_summary: model_summary
  - util@rich_progress_bar: rich_progress_bar
  - main@invariance_metric: invariance_metric
  - main@plotting: plotting
  - _self_

model_checkpoint:
  monitor: null # each epoch's file replaces the last, so best_model_path is the last epoch
  mode: min # ModelCheckpoint.state_key holds the mode, which the util config sets to max
  save_top_k: 1
  save_last: false
