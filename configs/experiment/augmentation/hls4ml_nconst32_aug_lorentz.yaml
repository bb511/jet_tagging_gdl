# @package _global_

# to execute this experiment run:
# python src/train.py experiment=augmentation/hls4ml_nconst32_aug_lorentz

defaults:
  - override /data: hls4ml
  - override /model: deepsets_32

tags: ["hls4ml", "nconst-32", "aug-lorentz"]
seed: 12345

data:
  nconstituents: 32
  method: augmentation
  augmentation_scheme: lorentz
  lorentz_nbr_rot: 8
  lorentz_eta_max: 2.0
  batch_size: 256
  n_folds: 1

trainer:
  max_epochs: 300
