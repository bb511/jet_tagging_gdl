# @package _global_

# to execute this experiment run:
# python src/train.py experiment=augmentation/hls4ml_nconst32_aug_so2

defaults:
  - override /data: hls4ml
  - override /model: deepsets_32

tags: ["hls4ml", "nconst-32", "aug-so2"]
seed: 12345

data:
  nconstituents: 32
  method: augmentation
  augmentation_scheme: so2
  batch_size: 2048
  n_folds: 1

trainer:
  max_epochs: 200
