# @package _global_

# to execute this experiment run:
# python src/train.py experiment=hls4ml_nconst8_aug_none

defaults:
  - override /data: hls4ml
  - override /model: deepsets_8

tags: ["hls4ml", "nconst-8", "aug-none"]
seed: 12345

data:
  nconstituents: 8
  method: augmentation
  augmentation_scheme: none
  batch_size: 256
  n_folds: 1

trainer:
  max_epochs: 300
