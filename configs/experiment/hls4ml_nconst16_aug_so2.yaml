# @package _global_

# to execute this experiment run:
# python src/train.py experiment=hls4ml_nconst16_aug_so2

defaults:
  - override /data: hls4ml
  - override /model: deepsets_16

tags: ["hls4ml", "nconst-16", "aug-so2"]
seed: 12345

data:
  nconstituents: 16
  augmentation_scheme: so2
  rotation_nbr_rot: 8
  batch_size: 256

trainer:
  max_epochs: 300
