# @package _global_
# Linformer at 100 constituents of the top-tagging set, on [pt, etarel, phirel], at the optimum of
# the hls4ml N = 150 baseline study on the same features (trial 142, val/acc_best 0.8197; block of
# scripts/hls4ml/pt_etarel_phirel/runlinformer_train.sh): the transfer point the top-tagging search
# starts from. Baseline regime only.
defaults:
  - override /data: top_tagging
  - override /algorithm: linformer
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "linformer", "nconst-100"]

experiment_name: top_tagging_linformer_nconst100

# Batch and loader processes as configs/experiment/hls4ml/linformer_150.yaml.
data:
  nconstituents: 100
  features: [pt, etarel, phirel]
  batch_size: 2048
  num_workers: 16

algorithm:
  output_dim: 2
  aggregation: max
  batchnorm: true
  embed_dim: 64
  ff_dim: 128
  head_layers: [64, 32]
  kv_proj_dim: 8
  optimizer:
    lr: 7.346058117514102e-4
    weight_decay: 1.0e-7
