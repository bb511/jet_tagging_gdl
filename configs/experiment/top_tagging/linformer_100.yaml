# @package _global_
# The Linformer at N = 100 on [pt, etarel, phirel] of the top-tagging set.
defaults:
  - override /data: top_tagging
  - override /algorithm: linformer
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "linformer", "nconst-100"]

experiment_name: top_tagging_linformer_nconst100

# The batch and loader processes of hls4ml/linformer_150.yaml.
data:
  nconstituents: 100
  features: [pt, etarel, phirel]
  batch_size: 2048
  num_workers: 16

# The hls4ml N = 150 baseline optimum on these columns, trial 142 (val/acc_best 0.8197).
algorithm:
  output_dim: 2
  aggregation: max
  batchnorm: true
  embed_dim: 64
  ff_dim: 128
  head_layers: [64, 32]
  kv_proj_dim: 8
  optimizer:
    lr: 7.346058117514102e-4
    weight_decay: 1.0e-7
