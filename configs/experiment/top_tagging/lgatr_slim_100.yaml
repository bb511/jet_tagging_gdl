# @package _global_
# L-GATr-slim with the spurion tokens (the time vector and both beams) at 100 constituents of the
# top-tagging set, on the published recipe (arXiv:2512.17011, App. A; tagger-quantization
# repository, config): the algorithm's 12 blocks of 32 vector and 96 scalar channels with 8 heads,
# Lion at 3e-5 with weight decay 2, cosine annealing, batch 128, 200k steps (21 epochs of the
# 1 211 000 training jets), gradients clipped at norm 1. The reference reads every constituent.
# Baseline regime only; the twin without the spurions is lgatr_slim_lorentz_100.yaml.
defaults:
  - override /data: top_tagging
  - override /algorithm: lgatr_slim
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "lgatr_slim", "nconst-100"]

experiment_name: top_tagging_lgatr_slim_nconst100

data:
  nconstituents: 100
  batch_size: 128

# Cosine annealing to zero over the run. Assigned whole, since a merge into the algorithm's
# OneCycleLR would keep max_lr and pct_start, which this schedule does not take.
scheduler:
  scheduler:
    _target_: src.algorithms.utils.schedules.cosine
    _partial_: true
  interval: step
  frequency: 1

algorithm:
  output_dim: 2
  # The paper states no betas, so Lion's defaults are written out.
  optimizer:
    _target_: lion_pytorch.Lion
    lr: 3.0e-5
    weight_decay: 2.0
    betas: [0.9, 0.99]
  scheduler: ${scheduler}

# fp32 and TF32 as configs/experiment/hls4ml/lgatr_slim_150.yaml. The trainer's clipping at norm 1
# is the reference's.
trainer:
  precision: 32
  max_epochs: 21

extras:
  matmul_precision: high

# Judged on its architecture rather than its inputs, so its rows skip the <features>/ directory.
results_table:
  subdir: embedded
