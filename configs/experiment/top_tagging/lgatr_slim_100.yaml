# @package _global_
# L-GATr-slim with the spurion tokens at N = 100 on the recipe of arXiv:2512.17011, App. A.
defaults:
  - override /data: top_tagging
  - override /algorithm: lgatr_slim
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "lgatr_slim", "nconst-100"]

experiment_name: top_tagging_lgatr_slim_nconst100

data:
  nconstituents: 100
  batch_size: 128

# Assigned whole through algorithm.scheduler, since a merge would keep OneCycleLR's keys.
scheduler:
  scheduler:
    _target_: src.algorithms.utils.schedules.cosine
    _partial_: true
  interval: step
  frequency: 1

algorithm:
  output_dim: 2
  optimizer:
    _target_: lion_pytorch.Lion
    lr: 3.0e-5
    weight_decay: 2.0
    betas: [0.9, 0.99] # Lion's defaults, the paper stating none
  scheduler: ${scheduler}

trainer:
  precision: 32 # the lgatr documentation advises against amp
  max_epochs: 21 # the reference's 200k steps at batch 128

extras:
  matmul_precision: high

results_table:
  subdir: embedded
