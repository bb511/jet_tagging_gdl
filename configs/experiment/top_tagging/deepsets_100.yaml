# @package _global_
# DeepSets at N = 100 on [pt, etarel, phirel] of the top-tagging set.
defaults:
  - override /data: top_tagging
  - override /algorithm: deepsets
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "deepsets", "nconst-100"]

experiment_name: top_tagging_deepsets_nconst100

# The batch and loader processes of hls4ml/deepsets_150.yaml.
data:
  nconstituents: 100
  features: [pt, etarel, phirel]
  batch_size: 2048
  num_workers: 16

# The hls4ml N = 150 baseline optimum on these columns, trial 55 (val/acc_best 0.8119).
algorithm:
  output_dim: 2
  aggregation: sum
  phi_layers: [64, 64, 32]
  rho_layers: [64, 32]
  optimizer:
    lr: 4.546765882927424e-3
    weight_decay: 1.0e-7
