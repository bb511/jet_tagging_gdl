# @package _global_
# L-GATr-slim without the spurion tokens at N = 100 on the recipe of its twin lgatr_slim_100.yaml.
defaults:
  - override /data: top_tagging
  - override /algorithm: lgatr_slim_lorentz
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "lgatr_slim_lorentz", "nconst-100"]

experiment_name: top_tagging_lgatr_slim_lorentz_nconst100

data:
  nconstituents: 100
  batch_size: 128

# Assigned whole through algorithm.scheduler, since a merge would keep OneCycleLR's keys.
scheduler:
  scheduler:
    _target_: src.algorithms.utils.schedules.cosine
    _partial_: true
  interval: step
  frequency: 1

algorithm:
  output_dim: 2
  optimizer:
    _target_: lion_pytorch.Lion
    lr: 3.0e-5
    weight_decay: 2.0
    betas: [0.9, 0.999] # the reference repository's, the paper stating none
  decay_1d_params: false # the reference decays the matrices alone
  scheduler: ${scheduler}

trainer:
  precision: 32 # the lgatr documentation advises against amp
  max_epochs: 21 # the reference's 200k steps at batch 128

extras:
  matmul_precision: highest # the reference's; TF32 raises the probe's TV from 1e-5 to 1e-2

results_table:
  subdir: embedded
