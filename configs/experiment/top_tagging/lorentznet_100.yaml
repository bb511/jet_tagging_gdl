# @package _global_
# LorentzNet at N = 100 on the published recipe of arXiv:2201.08187, sec. 3.3.
defaults:
  - override /data: top_tagging
  - override /algorithm: lorentznet
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "lorentznet", "nconst-100"]

experiment_name: top_tagging_lorentznet_nconst100

data:
  nconstituents: 100
  batch_size: 128

# Assigned whole through algorithm.scheduler, since a merge would keep the plateau scheduler's keys.
scheduler:
  scheduler:
    _target_: src.algorithms.utils.schedules.warmup_restarts_decay
    _partial_: true
    epochs: ${trainer.max_epochs}
  interval: step
  frequency: 1

algorithm:
  output_dim: 2
  n_hidden: 72
  n_layers: 6
  c_weight: 5.0e-3
  dropout: 0.2
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1.0e-3
    weight_decay: 0.01
  scheduler: ${scheduler}

trainer:
  precision: 32 # de-normalised edge invariants overflow fp16
  max_epochs: 35
  gradient_clip_val: null # the reference script clips no gradient

extras:
  matmul_precision: high

results_table:
  subdir: embedded
