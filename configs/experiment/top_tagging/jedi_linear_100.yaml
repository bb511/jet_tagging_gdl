# @package _global_
# JEDI-linear at 100 constituents of the top-tagging set, on [pt, etarel, phirel], at the optimum
# of the hls4ml N = 150 baseline study on the same features (trial 183, val/acc_best 0.8185; block
# of scripts/hls4ml/pt_etarel_phirel/runjedi_linear_train.sh): the transfer point the top-tagging
# search starts from. Baseline regime only.
defaults:
  - override /data: top_tagging
  - override /algorithm: jedi_linear
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "jedi_linear", "nconst-100"]

experiment_name: top_tagging_jedi_linear_nconst100

# Batch and loader processes as configs/experiment/hls4ml/jedi_linear_150.yaml.
data:
  nconstituents: 100
  features: [pt, etarel, phirel]
  batch_size: 2048
  num_workers: 16

algorithm:
  output_dim: 2
  aggregation: sum_over_n
  head_layers: [64, 32]
  hidden: 128
  optimizer:
    lr: 8.0066592398403e-3
    weight_decay: 1.0e-7
