# @package _global_
# JEDI-linear at N = 100 on [pt, etarel, phirel] of the top-tagging set.
defaults:
  - override /data: top_tagging
  - override /algorithm: jedi_linear
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "jedi_linear", "nconst-100"]

experiment_name: top_tagging_jedi_linear_nconst100

# The batch and loader processes of hls4ml/jedi_linear_150.yaml.
data:
  nconstituents: 100
  features: [pt, etarel, phirel]
  batch_size: 2048
  num_workers: 16

# The hls4ml N = 150 baseline optimum on these columns, trial 183 (val/acc_best 0.8185).
algorithm:
  output_dim: 2
  aggregation: sum_over_n
  head_layers: [64, 32]
  hidden: 128
  optimizer:
    lr: 8.0066592398403e-3
    weight_decay: 1.0e-7
