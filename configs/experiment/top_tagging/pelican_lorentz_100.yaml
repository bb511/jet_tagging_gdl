# @package _global_
# PELICAN without the beams at N = 100 on the recipe of its twin pelican_100.yaml.
defaults:
  - override /data: top_tagging
  - override /algorithm: pelican_lorentz
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "pelican_lorentz", "nconst-100"]

experiment_name: top_tagging_pelican_lorentz_nconst100

data:
  nconstituents: 100
  batch_size: 100

# Assigned whole through algorithm.scheduler, since a merge would keep the plateau scheduler's keys.
scheduler:
  scheduler:
    _target_: src.algorithms.utils.schedules.warmup_restarts_decay
    _partial_: true
    epochs: ${trainer.max_epochs}
  interval: step
  frequency: 1

algorithm:
  output_dim: 2
  n_blocks: 5
  n_message: 60 # num_channels_m of config/48k.yaml
  n_hidden: 35 # num_channels_2to2 of config/48k.yaml
  dropout: 0.01
  # The training jets' mean multiplicity at N = 100, 49.01 (2026-10-09), with no beams.
  nbar: 49.0
  n_chunks: 2
  optimizer:
    _target_: torch.optim.AdamW
    lr: 2.5e-3
    weight_decay: 5.0e-3
  scheduler: ${scheduler}

trainer:
  precision: 32 # de-normalised pair invariants overflow fp16
  max_epochs: 35

extras:
  matmul_precision: high

results_table:
  subdir: embedded
