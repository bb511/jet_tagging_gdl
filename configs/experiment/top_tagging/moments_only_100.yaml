# @package _global_
# The moments-only control at N = 100 of the top-tagging set.
defaults:
  - override /data: top_tagging
  - override /algorithm: moments_only
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "moments_only", "nconst-100"]

experiment_name: top_tagging_moments_only_nconst100

# The batch of hls4ml/moments_only_150.yaml.
data:
  nconstituents: 100
  features: [pt, etarel, phirel]
  batch_size: 2048

# The hls4ml N = 150 optimum, trial 105 (val/acc_best 0.8177).
algorithm:
  output_dim: 2
  moments: rankcut
  rho_layers: [64, 32]
  optimizer:
    lr: 5.462008936973458e-3
    weight_decay: 1.0e-6

results_table:
  subdir: embedded
