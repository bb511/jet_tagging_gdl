# @package _global_
# LLoCa with the SO(2) frames at N = 100 on the Lorentz-frames recipe of arXiv:2508.14898.
defaults:
  - override /data: top_tagging
  - override /algorithm: lloca_so2
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "lloca_so2", "nconst-100"]

experiment_name: top_tagging_lloca_so2_nconst100

data:
  nconstituents: 100
  batch_size: 128

# Assigned whole through algorithm.scheduler, since a merge would keep OneCycleLR's keys.
scheduler:
  scheduler:
    _target_: src.algorithms.utils.schedules.cosine_restarts
    _partial_: true
    cycles: 2 # the reference's two of 150k steps
  interval: step
  frequency: 1

algorithm:
  output_dim: 2
  num_blocks: 12
  num_heads: 8
  attn_scalars: 12
  attn_vectors: 1
  mlp_factor: 2
  framesnet_hidden: 128
  framesnet_dropout: 0.1
  dropout: 0.0 # the paper gives a dropout for the frames-net alone
  optimizer:
    _target_: lion_pytorch.Lion
    lr: 3.0e-5
    weight_decay: 2.0
    betas: [0.9, 0.999] # the paper's, not Lion's default
  scheduler: ${scheduler}

trainer:
  precision: 32 # its references train without amp
  max_epochs: 32 # the reference's 300k steps at batch 128

extras:
  matmul_precision: high

results_table:
  subdir: embedded
