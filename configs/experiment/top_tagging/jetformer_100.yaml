# @package _global_
# JetFormer at N = 100 on [pt, etarel, phirel] of the top-tagging set.
defaults:
  - override /data: top_tagging
  - override /algorithm: jetformer
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "jetformer", "nconst-100"]

experiment_name: top_tagging_jetformer_nconst100

# The batch and loader processes of hls4ml/jetformer_150.yaml.
data:
  nconstituents: 100
  features: [pt, etarel, phirel]
  batch_size: 2048
  num_workers: 16

# The hls4ml N = 150 baseline optimum on these columns, trial 134 (val/acc_best 0.8319).
algorithm:
  output_dim: 2
  dropout: 0.0
  embed_dim: 96
  num_heads: 4
  num_transformers: 4
  optimizer:
    lr: 4.586890241115531e-3
    weight_decay: 1.0e-3
