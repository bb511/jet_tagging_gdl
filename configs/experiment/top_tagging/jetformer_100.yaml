# @package _global_
# JetFormer at 100 constituents of the top-tagging set, on [pt, etarel, phirel], at the optimum of
# the hls4ml N = 150 baseline study on the same features (trial 134, val/acc_best 0.8319; block of
# scripts/hls4ml/pt_etarel_phirel/runjetformer_train.sh): the transfer point the top-tagging search
# starts from. Baseline regime only.
defaults:
  - override /data: top_tagging
  - override /algorithm: jetformer
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "jetformer", "nconst-100"]

experiment_name: top_tagging_jetformer_nconst100

# Batch and loader processes as configs/experiment/hls4ml/jetformer_150.yaml.
data:
  nconstituents: 100
  features: [pt, etarel, phirel]
  batch_size: 2048
  num_workers: 16

algorithm:
  output_dim: 2
  dropout: 0.0
  embed_dim: 96
  num_heads: 4
  num_transformers: 4
  optimizer:
    lr: 4.586890241115531e-3
    weight_decay: 1.0e-3
