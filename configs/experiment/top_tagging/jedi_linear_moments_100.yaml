# @package _global_
# JEDI-linear with the jet moments at N = 100 of the top-tagging set.
defaults:
  - override /data: top_tagging
  - override /algorithm: jedi_linear_moments
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "jedi_linear_moments", "nconst-100"]

experiment_name: top_tagging_jedi_linear_moments_nconst100

# The batch of hls4ml/jedi_linear_moments_150.yaml.
data:
  nconstituents: 100
  features: [pt, etarel, phirel]
  batch_size: 2048

# The hls4ml N = 150 optimum, trial 117 (val/acc_best 0.8245).
algorithm:
  output_dim: 2
  aggregation: sum_over_n
  head_layers: [64, 32]
  hidden: 128
  moments: rankcut
  optimizer:
    lr: 7.7387789876816725e-3
    weight_decay: 0.0

results_table:
  subdir: embedded
