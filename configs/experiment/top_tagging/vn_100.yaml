# @package _global_
# Vector neurons on the lifts of (pt, eta, phi) at N = 100 of the top-tagging set.
defaults:
  - override /data: top_tagging
  - override /algorithm: vn
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "vn", "nconst-100"]

experiment_name: top_tagging_vn_nconst100

# The batch of hls4ml/vn_150.yaml.
data:
  nconstituents: 100
  features: [pt, eta, phi]
  batch_size: 2048

# The hls4ml N = 150 optimum, trial 195 (val/acc_best 0.8269).
algorithm:
  output_dim: 2
  dropout: 0.0
  head_layers: [32]
  invariants: 32
  num_blocks: 3
  scalar_channels: 32
  stream_channels: 32
  tensor_invariants: 2
  vector_channels: 32
  optimizer:
    lr: 4.9250827523425545e-3
    weight_decay: 0.05

trainer:
  precision: 32 # the learned forms cancel to a small fraction of their terms

results_table:
  subdir: embedded
