# @package _global_
# DeepSets with the jet moments at N = 100 of the top-tagging set.
defaults:
  - override /data: top_tagging
  - override /algorithm: deepsets_moments
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "deepsets_moments", "nconst-100"]

experiment_name: top_tagging_deepsets_moments_nconst100

# The batch of hls4ml/deepsets_moments_150.yaml.
data:
  nconstituents: 100
  features: [pt, etarel, phirel]
  batch_size: 2048

# The hls4ml N = 150 optimum, trial 194 (val/acc_best 0.8227).
algorithm:
  output_dim: 2
  aggregation: sum
  moments: rankcut
  phi_layers: [64, 64, 64]
  rho_layers: [64, 32]
  optimizer:
    lr: 2.7931828696334776e-3
    weight_decay: 0.0

results_table:
  subdir: embedded
