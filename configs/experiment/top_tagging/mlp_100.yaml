# @package _global_
# The MLP at N = 100 on [pt, etarel, phirel] of the top-tagging set.
defaults:
  - override /data: top_tagging
  - override /algorithm: mlp
  - override /trainer: gpu
  - override /results_table: top_tagging

tags: ["top_tagging", "mlp", "nconst-100"]

experiment_name: top_tagging_mlp_nconst100

# The batch and loader processes of hls4ml/mlp_150.yaml.
data:
  nconstituents: 100
  features: [pt, etarel, phirel]
  batch_size: 2048
  num_workers: 16

# The hls4ml N = 150 baseline optimum on these columns, trial 55 (val/acc_best 0.7732).
algorithm:
  output_dim: 2
  batchnorm: true
  hidden_layers: [128, 64, 32]
  optimizer:
    lr: 1.37137525459169e-3
    weight_decay: 1.0e-4
