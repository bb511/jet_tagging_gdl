# @package _global_
# Boosted trees on the record's 53 jet-level observables (whole jet, hence N = 150), untuned.
defaults:
  - override /data: jet_level
  - override /algorithm: jet_level_bdt_all53
  - override /trainer: cpu

tags: ["hls4ml", "jet_level_bdt_all53", "nconst-150"]

experiment_name: hls4ml_jet_level_bdt_all53_nconst150

# No group acts on the observables, so a probe would report an invariance never tested.
callbacks:
  invariance_metric:
    probe: false

# scikit-learn grows the trees; Lightning refuses clipping under manual optimisation.
trainer:
  precision: 32
  gradient_clip_val: null

results_table:
  subdir: jet_level
