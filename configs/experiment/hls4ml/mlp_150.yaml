# @package _global_
# MLP at 150 constituents; data.method and data.augmentation_scheme stay CLI overrides.
defaults:
  - override /data: hls4ml
  - override /algorithm: mlp
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: mlflow

seed: 12345
tags: ["hls4ml", "mlp", "nconst-150"]

experiment_name: hls4ml_mlp_nconst150

data:
  nconstituents: 150
  batch_size: 2048
  n_folds: 5
  # The online transform of a 2048 x 150 batch takes 16 single-threaded workers to keep up with
  # the step (4 leave the GPU waiting 20 ms a batch); a job pinned with taskset needs as many CPUs.
  num_workers: 16

# The published widths, spelled out here because the searches replace them per constituent count.
algorithm:
  hidden_layers: [128, 64, 32]

trainer:
  max_epochs: 200
