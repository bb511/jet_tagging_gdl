# @package _global_
# L-GATr-slim without spurions at 50 constituents, at the untuned defaults.
defaults:
  - override /algorithm: lgatr_slim_lorentz
  - override /trainer: gpu

tags: ["hls4ml", "lgatr_slim_lorentz", "nconst-50"]

experiment_name: hls4ml_lgatr_slim_lorentz_nconst50

data:
  nconstituents: 50
  batch_size: 1024

# fp32: the lgatr documentation advises against mixed precision for the slim network.
trainer:
  precision: 32

# TF32 on Ampere and later, a no-op on a V100.
extras:
  matmul_precision: high

results_table:
  subdir: embedded
