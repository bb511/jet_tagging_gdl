# @package _global_
# The vector neurons trained quantisation-aware with HGQ2 at 150 constituents, in the architecture of
# the float vn finals, whose main run algorithm.init_from names; one constant beta per run, and the
# last epoch is the model. Symmetry-embedded, so it runs the baseline regime only.
defaults:
  - override /algorithm: vn_hgq
  - override /callbacks: quantised
  - override /trainer: gpu

tags: ["hls4ml", "vn_hgq", "nconst-150"]

experiment_name: hls4ml_vn_hgq_nconst150

data:
  nconstituents: 150
  # The network's own columns; required_features makes setup() refuse any other list.
  features: [pt, eta, phi]
  # In the driver: forked loader workers do not mix with the threads JAX has started.
  num_workers: 0
  pin_memory: false

algorithm:
  num_blocks: 3
  vector_channels: 32
  scalar_channels: 32
  invariants: 32
  tensor_invariants: 2
  stream_channels: 32
  head_layers: [32]
  dropout: 0.0

# fp32: 16-mixed would pass the mock optimiser's step through a gradient scaler, which finds no
# gradient to check. No clipping, which Lightning refuses under manual optimisation; the Keras
# optimiser clips instead (algorithm.optimizer.global_clipnorm).
trainer:
  max_epochs: 100
  precision: 32
  gradient_clip_val: null

# Judged as a quantised network, apart from the float rows of embedded/.
results_table:
  subdir: quantised
