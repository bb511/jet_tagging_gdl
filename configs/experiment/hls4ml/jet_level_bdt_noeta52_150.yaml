# @package _global_
# Boosted trees on the 52 jet-level observables but j_eta (whole jet, hence N = 150), untuned.
defaults:
  - override /data: jet_level
  - override /algorithm: jet_level_bdt_noeta52
  - override /trainer: cpu

tags: ["hls4ml", "jet_level_bdt_noeta52", "nconst-150"]

experiment_name: hls4ml_jet_level_bdt_noeta52_nconst150

data:
  # A row exact under the beam boost cannot see the jet rapidity, so this row is its ceiling.
  exclude: [j_eta]

# No group acts on the observables, so a probe would report an invariance never tested.
callbacks:
  invariance_metric:
    probe: false

# scikit-learn grows the trees; Lightning refuses clipping under manual optimisation.
trainer:
  precision: 32
  gradient_clip_val: null

results_table:
  subdir: jet_level
