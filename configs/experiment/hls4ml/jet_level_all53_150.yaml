# @package _global_
# The MLP on the record's 53 jet-level observables, labelled N = 150 since they are computed from the
# whole jet, at the algorithm defaults: a starting point, not tuned values. No group acts on the
# observables, so it runs the baseline regime only.
defaults:
  - override /data: jet_level
  - override /algorithm: jet_level_all53
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: mlflow

seed: 12345
tags: ["hls4ml", "jet_level_all53", "nconst-150"]

experiment_name: hls4ml_jet_level_all53_nconst150

data:
  nconstituents: 150
  batch_size: 2048
  n_folds: 5

# The probe would transform nothing and report a perfect invariance that was never tested. Under
# callbacks=search this leaves a node without _target_, which instantiate_callbacks skips.
callbacks:
  invariance_metric:
    probe: false

# The trainer's 16-mixed, as for the constituent MLP.
trainer:
  max_epochs: 200

# Judged against the networks rather than beside them, so its rows skip the <features>/ directory.
results_table:
  subdir: jet_level
