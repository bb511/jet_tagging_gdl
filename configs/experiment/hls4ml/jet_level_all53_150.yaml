# @package _global_
# The MLP on the record's 53 jet-level observables (whole jet, hence N = 150), untuned.
defaults:
  - override /data: jet_level
  - override /algorithm: jet_level_all53
  - override /trainer: gpu

tags: ["hls4ml", "jet_level_all53", "nconst-150"]

experiment_name: hls4ml_jet_level_all53_nconst150

# No group acts on the observables, so a probe would report an invariance never tested.
callbacks:
  invariance_metric:
    probe: false

results_table:
  subdir: jet_level
