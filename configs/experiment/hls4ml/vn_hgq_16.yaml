# @package _global_
# The vector neurons trained quantisation-aware with HGQ2 at 16 constituents, in the architecture of
# the float vn whose main run algorithm.init_from names; one constant beta per run, and the last
# epoch is the model. Symmetry-embedded, so it runs the baseline regime only.
defaults:
  - override /algorithm: vn_hgq
  - override /callbacks: quantised
  - override /trainer: gpu

tags: ["hls4ml", "vn_hgq", "nconst-16"]

experiment_name: hls4ml_vn_hgq_nconst16

data:
  nconstituents: 16
  # The network's own columns; required_features makes setup() refuse any other list.
  features: [pt, eta, phi]
  # In the driver: forked loader workers do not mix with the threads JAX has started.
  num_workers: 0
  pin_memory: false

# The study's best at N = 16 with one block in place of two, which comes within 0.1 points of the
# two-block best at about half the depth and cost; the paper shows the one-block scan alone.
algorithm:
  num_blocks: 1
  vector_channels: 16
  scalar_channels: 32
  invariants: 8
  tensor_invariants: 4
  stream_channels: 8
  head_layers: [64, 32]
  dropout: 0.0

# fp32: 16-mixed would pass the mock optimiser's step through a gradient scaler, which finds no
# gradient to check. No clipping, which Lightning refuses under manual optimisation; the Keras
# optimiser clips instead (algorithm.optimizer.global_clipnorm).
trainer:
  max_epochs: 100
  precision: 32
  gradient_clip_val: null

# Judged as a quantised network, apart from the float rows of embedded/.
results_table:
  subdir: quantised
