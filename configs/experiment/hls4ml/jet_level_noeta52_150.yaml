# @package _global_
# The MLP on the record's jet-level observables less the jet rapidity j_eta, 52 of them, labelled
# N = 150 since they are computed from the whole jet, at the algorithm defaults: a starting point,
# not tuned values. No group acts on the observables, so it runs the baseline regime only.
defaults:
  - override /data: jet_level
  - override /algorithm: jet_level_noeta52
  - override /trainer: gpu

tags: ["hls4ml", "jet_level_noeta52", "nconst-150"]

experiment_name: hls4ml_jet_level_noeta52_nconst150

data:
  # A row exact under the beam boost cannot see the jet rapidity, so this row is its ceiling.
  exclude: [j_eta]

# The probe would transform nothing and report a perfect invariance that was never tested. Under
# callbacks=search this leaves a node without _target_, which instantiate_callbacks skips.
callbacks:
  invariance_metric:
    probe: false

# Judged against the networks rather than beside them, so its rows skip the <features>/ directory.
results_table:
  subdir: jet_level
