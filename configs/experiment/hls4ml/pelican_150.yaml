# @package _global_
# PELICAN at 150 constituents, at the untuned defaults.
defaults:
  - override /algorithm: pelican
  - override /trainer: gpu

tags: ["hls4ml", "pelican", "nconst-150"]

experiment_name: hls4ml_pelican_nconst150

# A sixteenth of the usual batch: memory follows the squared slot count, 152 here.
data:
  nconstituents: 150
  batch_size: 128

# fp32: the de-normalised pair invariants p_i.p_j reach 1e5 to 1e6 GeV^2, above the fp16 maximum.
trainer:
  precision: 32

# TF32 on Ampere and later, a no-op on a V100; it keeps the fp32 range that forced precision 32.
extras:
  matmul_precision: high

algorithm:
  # Mean real multiplicity 49.44 of the training jets (record cache, 2026-09-13) plus the two beams.
  nbar: 51.4
  # Speed knob: the dense pair tensor over the 152 slots is 89 % padding.
  n_chunks: 2

results_table:
  subdir: embedded
