# @package _global_
# PELICAN at 150 constituents, at the algorithm defaults: a starting point, not tuned values.
# PELICAN is a symmetry-embedded class, so it runs the baseline regime only; data.method and
# data.augmentation_scheme still take CLI overrides, but anything else is outside the study design.
defaults:
  - override /algorithm: pelican
  - override /trainer: gpu

tags: ["hls4ml", "pelican", "nconst-150"]

experiment_name: hls4ml_pelican_nconst150

# A sixteenth of the usual batch: the pair tensor costs B * N^2 per channel and every slot is
# built whether or not it holds a constituent, so memory follows the squared slot count (152 with
# the beams) rather than the multiplicity.
data:
  nconstituents: 150
  batch_size: 128

# fp32, not the trainer's 16-mixed: the de-normalised pair invariants p_i.p_j reach 1e5 to 1e6
# GeV^2, above the fp16 maximum of 65 504, before the input embedding compresses them.
trainer:
  precision: 32

# TF32 matmuls on Ampere and later. The fp32 range that made these experiments force precision 32
# is kept (the Minkowski products are a bmm on de-normalised momenta anyway); only the linear
# layers lose mantissa. Set per experiment so searches, trainings and evaluations agree; a no-op
# on a V100.
extras:
  matmul_precision: high

algorithm:
  # Mean real multiplicity of the training jets at this truncation (49.44, measured
  # 2026-09-13 on the record cache) plus the two beams.
  nbar: 51.4
  # A speed knob (configs/algorithm/pelican.yaml): the pair tensor is dense over the 152 slots
  # while the mean real multiplicity is 49.4, so 89 % of it is padding.
  n_chunks: 2

# Judged on its architecture rather than its inputs, so its rows skip the <features>/ directory.
results_table:
  subdir: embedded
