# @package _global_
# JetFormer at 150 constituents; data.method and data.augmentation_scheme stay CLI overrides.
defaults:
  - override /data: hls4ml
  - override /algorithm: jetformer
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: mlflow

seed: 12345
tags: ["hls4ml", "jetformer", "nconst-150"]

experiment_name: hls4ml_jetformer_nconst150

data:
  nconstituents: 150
  batch_size: 2048
  n_folds: 5
  # The online transform of a 2048 x 150 batch takes 16 single-threaded workers to keep up with
  # the step (4 leave the GPU waiting 20 ms a batch); a job pinned with taskset needs as many CPUs.
  num_workers: 16

# No algorithm block: its defaults are the published configuration, until the searches replace them.
trainer:
  max_epochs: 200
