# @package _global_
# JetFormer for 150 constituents. Method and symmetry group are CLI overrides:
#   python src/train.py experiment=hls4ml/jetformer_150 data.method=symm_loss \
#       data.augmentation_scheme=so2
defaults:
  - override /data: hls4ml
  - override /algorithm: jetformer
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: mlflow

seed: 12345
tags: ["hls4ml", "jetformer", "nconst-150"]

experiment_name: hls4ml_jetformer_nconst150
run_name: ${short_hash:${hydra:runtime.output_dir},12}

data:
  nconstituents: 150
  batch_size: 2048
  n_folds: 5

# The algorithm defaults are the published configuration, so nothing is overridden here
# until the searches at this constituent count replace them.

trainer:
  max_epochs: 200
