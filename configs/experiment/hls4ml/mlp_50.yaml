# @package _global_
# MLP at 50 constituents; data.method and data.augmentation_scheme stay CLI overrides.
defaults:
  - override /algorithm: mlp
  - override /trainer: gpu

tags: ["hls4ml", "mlp", "nconst-50"]

experiment_name: hls4ml_mlp_nconst50

data:
  nconstituents: 50

# The published widths, spelled out here because the searches replace them per constituent count.
algorithm:
  hidden_layers: [128, 64, 32]
