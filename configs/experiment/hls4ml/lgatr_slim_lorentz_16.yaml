# @package _global_
# L-GATr-slim without spurions at 16 constituents, at the untuned defaults.
defaults:
  - override /algorithm: lgatr_slim_lorentz
  - override /trainer: gpu

tags: ["hls4ml", "lgatr_slim_lorentz", "nconst-16"]

experiment_name: hls4ml_lgatr_slim_lorentz_nconst16

data:
  nconstituents: 16

# fp32: the lgatr documentation advises against mixed precision for the slim network.
trainer:
  precision: 32

# TF32 on Ampere and later, a no-op on a V100.
extras:
  matmul_precision: high

results_table:
  subdir: embedded
