# @package _global_
# LorentzNet at 150 constituents, at the untuned defaults.
defaults:
  - override /algorithm: lorentznet
  - override /trainer: gpu

tags: ["hls4ml", "lorentznet", "nconst-150"]

experiment_name: hls4ml_lorentznet_nconst150

# A quarter of the usual batch: memory follows the squared multiplicity (mean 2 800 at 150 slots).
data:
  nconstituents: 150
  batch_size: 512

# fp32: the de-normalised edge invariants reach 1e4 to 1e5 GeV^2, above the fp16 maximum.
trainer:
  precision: 32

# TF32 on Ampere and later, a no-op on a V100; it keeps the fp32 range that forced precision 32.
extras:
  matmul_precision: high

results_table:
  subdir: embedded
