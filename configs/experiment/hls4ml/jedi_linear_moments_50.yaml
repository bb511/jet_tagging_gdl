# @package _global_
# JEDI-linear with the moments of [pt, etarel, phirel] at 50 constituents, at the untuned defaults.
defaults:
  - override /algorithm: jedi_linear_moments
  - override /trainer: gpu

tags: ["hls4ml", "jedi_linear_moments", "nconst-50"]

experiment_name: hls4ml_jedi_linear_moments_nconst50

data:
  nconstituents: 50
  # The network's own columns; required_features makes setup() refuse any other list.
  features: [pt, etarel, phirel]

# No extras.matmul_precision: the moments' terms cancel, which TF32's rounding would not resolve.

results_table:
  subdir: embedded
