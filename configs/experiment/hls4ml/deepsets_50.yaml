# @package _global_
# DeepSets at 50 constituents; data.method and data.augmentation_scheme stay CLI overrides.
defaults:
  - override /algorithm: deepsets
  - override /trainer: gpu

tags: ["hls4ml", "deepsets", "nconst-50"]

experiment_name: hls4ml_deepsets_nconst50

data:
  nconstituents: 50

# From the earlier study's 32-constituent search: a starting point, not tuned at this count.
algorithm:
  phi_layers: [64, 64, 32]
  rho_layers: [32, 32, 16]
  optimizer:
    lr: 2.8e-3
