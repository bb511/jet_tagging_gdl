# @package _global_
# Vector neurons on the lifts of (pt, eta, phi) at 50 constituents, at the untuned defaults.
defaults:
  - override /algorithm: vn
  - override /trainer: gpu

tags: ["hls4ml", "vn", "nconst-50"]

experiment_name: hls4ml_vn_nconst50

data:
  nconstituents: 50
  # The network's own columns; required_features makes setup() refuse any other list.
  features: [pt, eta, phi]

# fp32: the forms of the learned channels cancel to a small fraction of their terms.
trainer:
  precision: 32

# No extras.matmul_precision: under TF32 the group would hold only to about 5e-4.

results_table:
  subdir: embedded
