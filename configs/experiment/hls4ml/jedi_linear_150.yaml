# @package _global_
# JEDI-linear at 150 constituents at the algorithm defaults, which are the published point: a
# starting point, not tuned values. As a comparator from the literature it runs the baseline regime
# alone, but it reads data.features like DeepSets, so its rows land in results/<features>/ rather
# than results/embedded/.
defaults:
  - override /data: hls4ml
  - override /algorithm: jedi_linear
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: mlflow

seed: 12345
tags: ["hls4ml", "jedi_linear", "nconst-150"]

experiment_name: hls4ml_jedi_linear_nconst150

# Set by a V100 pre-flight at the largest search point (hidden 128, head [64, 32, 16],
# 61 125 parameters on four features; 2026-09-30, reserved memory): 0.77 GiB and 6.3 ms/step at 2048
# jets, which fits a 1g MIG slice.
data:
  nconstituents: 150
  batch_size: 2048
  n_folds: 5
  # deepsets_150.yaml sets num_workers: 16 to keep up with the online transform, which the
  # baseline regime does not attach, so the default holds here.

trainer:
  max_epochs: 200
