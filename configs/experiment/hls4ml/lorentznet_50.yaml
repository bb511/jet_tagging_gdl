# @package _global_
# LorentzNet at 50 constituents, at the algorithm defaults: a starting point for the
# searches, not tuned values. Method and symmetry group are CLI overrides:
#   python src/train.py experiment=hls4ml/lorentznet_50 data.method=symm_loss \
#       data.augmentation_scheme=so2
defaults:
  - override /data: hls4ml
  - override /algorithm: lorentznet
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: mlflow

seed: 12345
tags: ["hls4ml", "lorentznet", "nconst-50"]

experiment_name: hls4ml_lorentznet_nconst50
run_name: ${short_hash:${hydra:runtime.output_dir},12}

# Half the batch of the other models at this width: only edges between real
# constituents are built, so the memory follows the squared multiplicity, whose mean
# over the record is 1 800 once capped at 50 slots. One step then holds 22 GiB of a
# 32 GB V100 at 1024 jets, and does not fit at 1536.
data:
  nconstituents: 50
  batch_size: 1024
  n_folds: 5

# fp32 rather than the 16-mixed of the gpu trainer: the network works on de-normalised
# four-momenta, so edge invariants of order 1e4 to 1e5 GeV^2 are formed before the signed
# log compresses them, above the fp16 maximum of 65 504.
trainer:
  max_epochs: 200
  precision: 32
