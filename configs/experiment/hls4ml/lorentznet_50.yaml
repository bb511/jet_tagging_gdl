# @package _global_
# LorentzNet at 50 constituents, at the algorithm defaults: a starting point, not tuned values.
# LorentzNet is the symmetry-embedded class, so it runs the baseline regime only; data.method and
# data.augmentation_scheme still take CLI overrides, but anything else is outside the study design.
defaults:
  - override /data: hls4ml
  - override /algorithm: lorentznet
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: mlflow

seed: 12345
tags: ["hls4ml", "lorentznet", "nconst-50"]

experiment_name: hls4ml_lorentznet_nconst50
run_name: ${short_hash:${hydra:runtime.output_dir},12}

# Half the usual batch: only real-constituent edges are built, so memory follows the squared
# multiplicity (mean 1 800 at 50 slots), 22 GiB of a 32 GB V100 at 1024 jets and no fit at 1536.
data:
  nconstituents: 50
  batch_size: 1024
  n_folds: 5

# fp32, not the trainer's 16-mixed: de-normalised edge invariants reach 1e4 to 1e5 GeV^2, above the
# fp16 maximum of 65 504, before the signed log compresses them.
trainer:
  max_epochs: 200
  precision: 32

# TF32 matmuls on Ampere and later. The fp32 range that made these experiments force precision 32
# is kept (the de-normalised Minkowski invariants are elementwise anyway); only the linear layers
# lose mantissa. Set per experiment so searches, trainings and evaluations agree; a no-op on a V100.
extras:
  matmul_precision: high
