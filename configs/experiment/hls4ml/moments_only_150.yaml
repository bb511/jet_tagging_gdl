# @package _global_
# The moments-only control on [pt, etarel, phirel] at 150 constituents, at the untuned defaults.
defaults:
  - override /algorithm: moments_only
  - override /trainer: gpu

tags: ["hls4ml", "moments_only", "nconst-150"]

experiment_name: hls4ml_moments_only_nconst150

data:
  nconstituents: 150
  # The network's own columns; required_features makes setup() refuse any other list.
  features: [pt, etarel, phirel]

# No extras.matmul_precision: the moments' terms cancel, which TF32's rounding would not resolve.

results_table:
  subdir: embedded
