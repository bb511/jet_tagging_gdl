# @package _global_
# JEDI-linear with the jet moments of [pt, etarel, phirel] at 16 constituents, at the algorithm
# defaults: a starting point, not tuned values. Pinned to its columns and filed with the embedded
# rows, so it runs the baseline regime only.
defaults:
  - override /algorithm: jedi_linear_moments
  - override /trainer: gpu

tags: ["hls4ml", "jedi_linear_moments", "nconst-16"]

experiment_name: hls4ml_jedi_linear_moments_nconst16

data:
  nconstituents: 16
  # The network's own columns; required_features makes setup() refuse any other list.
  features: [pt, etarel, phirel]

# The trainer's 16-mixed, as for DeepSets and JEDI-linear, and no extras.matmul_precision: the
# moments are computed in float32 with autocast off, since they are cubic in p_T, and TF32 would
# round the inputs of their products to about 5e-4 while pair, chain and triangle cancel between
# large terms. tests/test_configs.py keeps both keys unset.

# Filed with the embedded rows, so its rows skip the <features>/ directory.
results_table:
  subdir: embedded
