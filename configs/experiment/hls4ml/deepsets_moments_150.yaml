# @package _global_
# DeepSets with the moments of [pt, etarel, phirel] at 150 constituents, at the untuned defaults.
defaults:
  - override /algorithm: deepsets_moments
  - override /trainer: gpu

tags: ["hls4ml", "deepsets_moments", "nconst-150"]

experiment_name: hls4ml_deepsets_moments_nconst150

data:
  nconstituents: 150
  # The network's own columns; required_features makes setup() refuse any other list.
  features: [pt, etarel, phirel]

# No extras.matmul_precision: the moments' terms cancel, which TF32's rounding would not resolve.

results_table:
  subdir: embedded
