# @package _global_
# LorentzNet at 16 constituents, at the untuned defaults.
defaults:
  - override /algorithm: lorentznet
  - override /trainer: gpu

tags: ["hls4ml", "lorentznet", "nconst-16"]

experiment_name: hls4ml_lorentznet_nconst16

data:
  nconstituents: 16

# fp32: the de-normalised edge invariants reach 1e4 to 1e5 GeV^2, above the fp16 maximum.
trainer:
  precision: 32

# TF32 on Ampere and later, a no-op on a V100; it keeps the fp32 range that forced precision 32.
extras:
  matmul_precision: high

results_table:
  subdir: embedded
