# @package _global_
# Vector neurons with the SO(2) partition at 150 constituents, at the algorithm defaults: a
# starting point, not tuned values. Symmetry-embedded, so it runs the baseline regime only; the
# other row is vn_z_150.yaml.
defaults:
  - override /data: hls4ml
  - override /algorithm: vn_so2
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: mlflow

seed: 12345
tags: ["hls4ml", "vn_so2", "nconst-150"]

experiment_name: hls4ml_vn_so2_nconst150

# Set by a V100 pre-flight at the largest search point (6 blocks, 64 vector and 128 scalar
# channels, 32 invariants, head [128, 64], 0.73 M parameters; 2026-09-29, reserved memory):
# 0.15 GiB and 18 ms/step at 2048 jets, which fits a 1g MIG slice.
data:
  nconstituents: 150
  batch_size: 2048
  n_folds: 5

# fp32, not the trainer's 16-mixed: the products of the de-normalised vector channels cancel to a
# small fraction of their terms, which fp16 cannot resolve.
trainer:
  max_epochs: 200
  precision: 32

# No extras.matmul_precision, unlike the other embedded experiments: TF32 rounds the inputs of every
# float32 matmul to about 5e-4, and the linear layers of this network act on the vector components
# themselves, so a transformed jet would be rounded differently and the embedded group would hold
# to that precision only. tests/test_configs.py keeps the key unset.

# Judged on its architecture rather than its inputs, so its rows skip the <features>/ directory.
results_table:
  subdir: embedded
