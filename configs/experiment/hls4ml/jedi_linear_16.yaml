# @package _global_
# JEDI-linear at 16 constituents at the algorithm defaults, which are the published point: a
# starting point, not tuned values. As a comparator from the literature it runs the baseline regime
# alone, but it reads data.features like DeepSets, so its rows land in results/<features>/ rather
# than results/embedded/.
defaults:
  - override /data: hls4ml
  - override /algorithm: jedi_linear
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: mlflow

seed: 12345
tags: ["hls4ml", "jedi_linear", "nconst-16"]

experiment_name: hls4ml_jedi_linear_nconst16

# Set by a V100 pre-flight at the largest search point (hidden 128, head [64, 32, 16],
# 61 125 parameters on four features; 2026-09-30, reserved memory): 0.12 GiB and 3.3 ms/step at 2048
# jets, which fits a 1g MIG slice.
data:
  nconstituents: 16
  batch_size: 2048
  n_folds: 5

trainer:
  max_epochs: 200
