# @package _global_
# LLoCa with the SO(3) frames (LearnedSO3Frames) at 150 constituents, at the untuned defaults.
defaults:
  - override /algorithm: lloca_so3
  - override /trainer: gpu

tags: ["hls4ml", "lloca_so3", "nconst-150"]

experiment_name: hls4ml_lloca_so3_nconst150

data:
  nconstituents: 150
  batch_size: 512

# fp32, as the references train LLoCa without mixed precision.
trainer:
  precision: 32

# TF32 on Ampere and later, a no-op on a V100.
extras:
  matmul_precision: high

results_table:
  subdir: embedded
