# @package _global_
# LLoCa with the SO(2) frames (LearnedSO2Frames) at 16 constituents, at the untuned defaults.
defaults:
  - override /algorithm: lloca_so2
  - override /trainer: gpu

tags: ["hls4ml", "lloca_so2", "nconst-16"]

experiment_name: hls4ml_lloca_so2_nconst16

data:
  nconstituents: 16

# fp32, as the references train LLoCa without mixed precision.
trainer:
  precision: 32

# TF32 on Ampere and later, a no-op on a V100.
extras:
  matmul_precision: high

results_table:
  subdir: embedded
