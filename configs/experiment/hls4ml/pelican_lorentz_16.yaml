# @package _global_
# PELICAN without the beams at 16 constituents, at the untuned defaults.
defaults:
  - override /algorithm: pelican_lorentz
  - override /trainer: gpu

tags: ["hls4ml", "pelican_lorentz", "nconst-16"]

experiment_name: hls4ml_pelican_lorentz_nconst16

data:
  nconstituents: 16

# fp32: the de-normalised pair invariants p_i.p_j reach 1e5 to 1e6 GeV^2, above the fp16 maximum.
trainer:
  precision: 32

# TF32 on Ampere and later, a no-op on a V100; it keeps the fp32 range that forced precision 32.
extras:
  matmul_precision: high

algorithm:
  # Mean real multiplicity 15.98 of the training jets (record cache, 2026-09-13); no beams to add.
  nbar: 16.0

results_table:
  subdir: embedded
