# @package _global_
# DeepSets at 150 constituents; data.method and data.augmentation_scheme stay CLI overrides.
defaults:
  - override /data: hls4ml
  - override /algorithm: deepsets
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: mlflow

seed: 12345
tags: ["hls4ml", "deepsets", "nconst-150"]

experiment_name: hls4ml_deepsets_nconst150

data:
  nconstituents: 150
  batch_size: 2048
  n_folds: 5
  # The online transform of a 2048 x 150 batch takes 16 single-threaded workers to keep up with
  # the step (4 leave the GPU waiting 20 ms a batch); a job pinned with taskset needs as many CPUs.
  num_workers: 16

# From the earlier study's 32-constituent search: a starting point, not tuned at this count.
algorithm:
  phi_layers: [64, 64, 32]
  rho_layers: [32, 32, 16]
  optimizer:
    lr: 2.8e-3

trainer:
  max_epochs: 200
