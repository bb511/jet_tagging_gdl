# @package _global_
# LLoCa with the SO(2)xSO(1,1) frames (LearnedZFrames) at 50 constituents, at the algorithm
# defaults: a starting point, not tuned values. Symmetry-embedded, so it runs the baseline regime
# only; the other three rows are lloca_{lorentz,so2,so3}_50.yaml.
defaults:
  - override /data: hls4ml
  - override /algorithm: lloca_z
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: mlflow

seed: 12345
tags: ["hls4ml", "lloca_z", "nconst-50"]

experiment_name: hls4ml_lloca_z_nconst50

# Set by a V100 pre-flight at the largest search point (12 blocks, 8 heads, 16x0n+4x1n per head,
# mlp_factor 4, frames-net hidden 64, 9.5M parameters; 2026-09-28): 14.8 GiB and 0.46 s/step at
# 1024 jets, which fits a full card but not a 1g MIG slice.
data:
  nconstituents: 50
  batch_size: 1024
  n_folds: 5

# fp32, not the trainer's 16-mixed: the wrapper hands the frames-net float64 momenta (in float32 the
# massless constituents' pair masses fall to zero and the frames-net's sqrt has no finite gradient),
# the package keeps the orthonormalisation in float64, and the references train LLoCa without amp.
trainer:
  max_epochs: 200
  precision: 32

# TF32 matmuls on Ampere and later, as in the other embedded experiments; a no-op on a V100.
extras:
  matmul_precision: high

# Judged on its architecture rather than its inputs, so its rows skip the <features>/ directory.
results_table:
  subdir: embedded
