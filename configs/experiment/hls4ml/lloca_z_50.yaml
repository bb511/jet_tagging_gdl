# @package _global_
# LLoCa with the SO(2)xSO(1,1) frames (LearnedZFrames) at 50 constituents, at the untuned defaults.
defaults:
  - override /algorithm: lloca_z
  - override /trainer: gpu

tags: ["hls4ml", "lloca_z", "nconst-50"]

experiment_name: hls4ml_lloca_z_nconst50

data:
  nconstituents: 50
  batch_size: 1024

# fp32, as the references train LLoCa without mixed precision.
trainer:
  precision: 32

# TF32 on Ampere and later, a no-op on a V100.
extras:
  matmul_precision: high

results_table:
  subdir: embedded
