# @package _global_
# MLP at 16 constituents; data.method and data.augmentation_scheme stay CLI overrides.
defaults:
  - override /data: hls4ml
  - override /algorithm: mlp
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: mlflow

seed: 12345
tags: ["hls4ml", "mlp", "nconst-16"]

experiment_name: hls4ml_mlp_nconst16

data:
  nconstituents: 16
  batch_size: 2048
  n_folds: 5

# The published widths, spelled out here because the searches replace them per constituent count.
algorithm:
  hidden_layers: [128, 64, 32]

trainer:
  max_epochs: 200
