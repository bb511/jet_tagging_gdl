# @package _global_
# PELICAN without the beams at 150 constituents, unsearched: it runs at the beams-on optimum.
defaults:
  - override /algorithm: pelican_lorentz
  - override /trainer: gpu

tags: ["hls4ml", "pelican_lorentz", "nconst-150"]

experiment_name: hls4ml_pelican_lorentz_nconst150

# A sixteenth of the usual batch: memory follows the squared slot count, 150 here.
data:
  nconstituents: 150
  batch_size: 128

# fp32: the de-normalised pair invariants p_i.p_j reach 1e5 to 1e6 GeV^2, above the fp16 maximum.
trainer:
  precision: 32

# TF32 on Ampere and later, a no-op on a V100; it keeps the fp32 range that forced precision 32.
extras:
  matmul_precision: high

algorithm:
  # Mean real multiplicity 49.44 of the training jets (record cache, 2026-09-13); no beams to add.
  nbar: 49.4
  # Speed knob, measured in ARCHITECTURES.md ("PELICAN"): two chunks on a dedicated card.
  n_chunks: 2
  # Best trial of pelican_nconst150_augmentation_none: 131 of 340, val/acc_best 0.8447.
  n_blocks: 5
  n_hidden: 35
  n_message: 35
  dropout: 0.0
  optimizer:
    lr: 4.672189427263489e-4
    weight_decay: 1.0e-5

results_table:
  subdir: embedded
