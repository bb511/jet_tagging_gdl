# @package _global_
# Tuned DeepSets at 16 constituents; data.method and data.augmentation_scheme stay CLI overrides.
defaults:
  - override /data: hls4ml
  - override /algorithm: deepsets
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: mlflow

seed: 12345
tags: ["hls4ml", "deepsets", "nconst-16"]

experiment_name: hls4ml_deepsets_nconst16
run_name: ${short_hash:${hydra:runtime.output_dir},12}

data:
  nconstituents: 16
  batch_size: 2048
  n_folds: 5

# Widths and learning rate from the search over 16 constituents.
algorithm:
  phi_layers: [64, 32, 32]
  rho_layers: [32, 16]
  optimizer:
    lr: 2.8e-3

trainer:
  max_epochs: 200
