# @package _global_
# Linformer at 150 constituents; data.method and data.augmentation_scheme stay CLI overrides.
defaults:
  - override /data: hls4ml
  - override /algorithm: linformer
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: mlflow

seed: 12345
tags: ["hls4ml", "linformer", "nconst-150"]

experiment_name: hls4ml_linformer_nconst150

# Set by a V100 pre-flight at the largest search point (width 64, k = 8, ff 128, head [64, 32],
# BatchNorm on, 42 853 parameters on four features; 2026-10-01, reserved memory): 0.97 GiB and
# 13.1 ms/step at 2048 jets, which fits a 1g MIG slice.
data:
  nconstituents: 150
  batch_size: 2048
  n_folds: 5
  # The online transform of a 2048 x 150 batch takes 16 single-threaded workers to keep up with
  # the step (4 leave the GPU waiting 20 ms a batch); a job pinned with taskset needs as many CPUs.
  num_workers: 16

# No algorithm block: its defaults are the point of the reference example in float (width 16, k = 4,
# head [16]), until the searches replace them.
trainer:
  max_epochs: 200
