# @package _global_
# Linformer at 150 constituents; data.method and data.augmentation_scheme stay CLI overrides.
defaults:
  - override /algorithm: linformer
  - override /trainer: gpu

tags: ["hls4ml", "linformer", "nconst-150"]

experiment_name: hls4ml_linformer_nconst150

data:
  nconstituents: 150
  # The online transform of 2048 x 150 jets needs 16 workers; 4 leave the GPU idle 20 ms a batch.
  num_workers: 16
# Algorithm defaults: the reference example's point in float (width 16, k = 4, head [16]).
