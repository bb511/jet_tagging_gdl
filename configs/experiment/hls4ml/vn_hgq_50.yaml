# @package _global_
# Vector neurons quantised with HGQ2 at 50 constituents, fine-tuned from algorithm.init_from.
defaults:
  - override /algorithm: vn_hgq
  - override /callbacks: quantised
  - override /trainer: gpu

tags: ["hls4ml", "vn_hgq", "nconst-50"]

experiment_name: hls4ml_vn_hgq_nconst50

data:
  nconstituents: 50
  # The network's own columns; required_features makes setup() refuse any other list.
  features: [pt, eta, phi]
  # In the driver: forked loader workers do not mix with the threads JAX has started.
  num_workers: 0
  pin_memory: false

# The architecture of the vn finals at N = 50.
algorithm:
  num_blocks: 3
  vector_channels: 32
  scalar_channels: 32
  invariants: 8
  tensor_invariants: 4
  stream_channels: 16
  head_layers: [64, 32]
  dropout: 0.0

# fp32: 16-mixed would put a gradient scaler on the mock step; Keras clips (global_clipnorm).
trainer:
  max_epochs: 100
  precision: 32
  gradient_clip_val: null

results_table:
  subdir: quantised
