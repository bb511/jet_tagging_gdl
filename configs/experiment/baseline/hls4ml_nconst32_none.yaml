# @package _global_

# to execute this experiment run:
# python src/train.py experiment=baseline/hls4ml_nconst32_none

defaults:
  - override /data: hls4ml

tags: ["hls4ml", "nconst-32", "baseline"]
seed: 12345

data:
  nconstituents: 32
  method: augmentation
  augmentation_scheme: none
  online_augmentation: true
  batch_size: 2048
  n_folds: 1

trainer:
  max_epochs: 200
