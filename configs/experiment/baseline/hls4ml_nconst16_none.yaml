# @package _global_

# to execute this experiment run:
# python src/train.py experiment=baseline/hls4ml_nconst16_none

defaults:
  - override /data: hls4ml
  - override /model: deepsets_16

tags: ["hls4ml", "nconst-16", "baseline"]
seed: 12345

data:
  nconstituents: 16
  method: augmentation
  augmentation_scheme: none
  online_augmentation: true
  batch_size: 4096
  n_folds: 1

trainer:
  max_epochs: 200