# @package _global_

# Baseline experiment for inherently invariant/equivariant models (no augmentation, no symm_loss).
# Model is not set here — always provide it from the CLI:
#   python src/train.py model=irc_deepsets_32 experiment=equivariance/hls4ml_nconst32_none

defaults:
  - override /data: hls4ml

tags: ["hls4ml", "nconst-32", "equivariant-baseline"]
seed: 12345

data:
  nconstituents: 32
  method: equivariance
  augmentation_scheme: none
  batch_size: 2048
  n_folds: 1

trainer:
  max_epochs: 200
