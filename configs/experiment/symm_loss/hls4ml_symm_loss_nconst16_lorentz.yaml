# @package _global_

# to execute this experiment run:
# python src/train.py experiment=symm_loss/hls4ml_symm_loss_nconst16_lorentz

defaults:
  - override /data: hls4ml
  - override /model: deepsets_16

tags: ["hls4ml", "nconst-16", "symm-loss"]
seed: 12345

data:
  nconstituents: 16
  method: symm_loss
  batch_size: 256

model:
  group: lorentz

trainer:
  max_epochs: 300

