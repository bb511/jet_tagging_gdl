# @package _global_

# to execute this experiment run:
# python src/train.py experiment=symm_loss/hls4ml_symm_loss_nconst32_lorentz

defaults:
  - override /data: hls4ml
  - override /model: deepsets_32

tags: ["hls4ml", "nconst-32", "symm-loss"]
seed: 12345

data:
  nconstituents: 32
  method: symm_loss
  augmentation_scheme: lorentz
  batch_size: 2048
  n_folds: 1

model:
  group: lorentz

trainer:
  max_epochs: 200

