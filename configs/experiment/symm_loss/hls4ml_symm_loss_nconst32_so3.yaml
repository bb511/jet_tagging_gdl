# @package _global_

# to execute this experiment run:
# python src/train.py experiment=hls4ml_symm_loss_nconst32_so3

defaults:
  - override /data: hls4ml
  - override /model: deepsets_32

tags: ["hls4ml", "nconst-32", "symm-loss"]
seed: 12345

data:
  nconstituents: 32
  method: symm_loss

batch_size: 256

callbacks:
  invariance_metric: null

model:
  group: so3

trainer:
  max_epochs: 300