# @package _global_

# to execute this experiment run:
# python src/train.py experiment=symm_loss/hls4ml_symm_loss_nconst32_so3

defaults:
  - override /data: hls4ml
  - override /model: deepsets_32

tags: ["hls4ml", "nconst-32", "symm-loss"]
seed: 12345

data:
  nconstituents: 32
  method: symm_loss
  augmentation_scheme: so3
  batch_size: 256

model:
  group: so3

trainer:
  max_epochs: 200
