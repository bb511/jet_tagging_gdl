# @package _global_

# to execute this experiment run:
# python src/train.py experiment=symm_loss/hls4ml_symm_loss_nconst8_so2

defaults:
  - override /data: hls4ml
  - override /model: deepsets_8

tags: ["hls4ml", "nconst-8", "symm-loss"]
seed: 12345

data:
  nconstituents: 8
  method: symm_loss
  augmentation_scheme: so2
  batch_size: 2048
  n_folds: 1

model:
  group: so2

trainer:
  max_epochs: 200

