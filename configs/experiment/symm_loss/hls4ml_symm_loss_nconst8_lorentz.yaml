# @package _global_

# to execute this experiment run:
# python src/train.py experiment=symm_loss/hls4ml_symm_loss_nconst8_lorentz

defaults:
  - override /data: hls4ml
  - override /model: deepsets_8

tags: ["hls4ml", "nconst-8", "symm-loss"]
seed: 12345

data:
  nconstituents: 8
  method: symm_loss
  augmentation_scheme: lorentz
  batch_size: 256

model:
  group: lorentz

trainer:
  max_epochs: 300
callbacks:
  invariance_metric: null
