# JetFormer, the attention tagger: a replica of arXiv:2601.17215 down to its missing padding mask.
_target_: src.algorithms.jetformer.JetFormer
_convert_: all # _set_up_scheduler pops from the scheduler dict, so it must not be a DictConfig
name: jetformer

nconstituents: ${data.nconstituents}
nbr_feats: ${len:${data.features}}
output_dim: 5

# Interpolated, so one CLI override (data.method=symm_loss) configures data and algorithm together.
method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
symm_loss_metric: l2
lorentz_eta_max: ${data.lorentz_eta_max}

embed_dim: 64
num_heads: 2
num_transformers: 3
normalization: layer # rather than the reference's batch norm, as every run of this study used
activation: relu
dropout: 0.0

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-3
  weight_decay: 1.0e-2

# One cycle over the whole run, hence stepped per batch. total_steps is injected by
# JetTaggingModule._set_up_scheduler, the run length being known only once the trainer is attached.
scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.OneCycleLR
    _partial_: true
    max_lr: ${algorithm.optimizer.lr}
    pct_start: 0.2
  interval: step
  frequency: 1

compile: false
