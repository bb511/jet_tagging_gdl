# JetFormer as in arXiv:2601.17215 (no padding mask), without its unused score-norm layer.
_target_: src.algorithms.jetformer.JetFormer
_convert_: all # plain dicts, since _set_up_scheduler pops from the scheduler
name: jetformer

nconstituents: ${data.nconstituents}
nbr_feats: ${len:${data.features}}
output_dim: 5

method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
transform_kwargs: ${data.transform_kwargs}

embed_dim: 64
num_heads: 2
num_transformers: 3
normalization: layer # as in every run of this study; the reference uses batch norm
activation: relu
dropout: 0.0

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-3
  weight_decay: 1.0e-2

# Stepped per batch; _set_up_scheduler injects total_steps.
scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.OneCycleLR
    _partial_: true
    max_lr: ${algorithm.optimizer.lr}
    pct_start: 0.2
  interval: step
  frequency: 1

compile: false
