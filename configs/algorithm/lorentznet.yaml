# LorentzNet, arXiv:2201.08187; per-N values in the experiment configs.
_target_: src.algorithms.lorentznet.LorentzNet
_convert_: all # plain dicts, since _set_up_scheduler pops from the scheduler
name: lorentznet

nconstituents: ${data.nconstituents}
nbr_feats: 4 # required_features pins [px, py, pz, e]
output_dim: 5

method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
transform_kwargs: ${data.transform_kwargs}

# The paper's widths, 224k parameters.
n_hidden: 72
n_layers: 6
c_weight: 1.0e-3 # step size of the LGEB coordinate updates
dropout: 0.0

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1.0e-3
  weight_decay: 1.0e-7

scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: max
    patience: 80
    factor: 0.1
    threshold: 1.0e-4
  monitor: val/acc
  interval: epoch
  frequency: 1

compile: false
