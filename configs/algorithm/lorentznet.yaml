# LorentzNet, the Lorentz-invariant tagger (arXiv:2201.08187). Defaults here, per-nconstituents
# values in configs/experiment/hls4ml/lorentznet_<N>.yaml.
_target_: src.algorithms.lorentznet.LorentzNet
_convert_: all # _set_up_scheduler pops from the scheduler dict, so it must not be a DictConfig
name: lorentznet

nconstituents: ${data.nconstituents}
nbr_feats: 4 # not ${len:...}: the net reads the four-momentum alone, so features must be px,py,pz,e
output_dim: 5

# Interpolated, so one CLI override (data.method=symm_loss) configures data and algorithm together.
# LorentzNet is scripted in the baseline regime alone, so both resolve to augmentation/none.
method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
symm_loss_metric: l2
lorentz_eta_max: ${data.lorentz_eta_max}

# Widths from the paper, 224k parameters; the searches replace them per nconstituents.
n_hidden: 72
n_layers: 6
c_weight: 1.0e-3 # step size of the coordinate updates inside an LGEB block
dropout: 0.0

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1.0e-3
  weight_decay: 1.0e-7

scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: max
    patience: 80
    factor: 0.1
    threshold: 1.0e-4
  monitor: val/acc
  interval: epoch
  frequency: 1

compile: false
