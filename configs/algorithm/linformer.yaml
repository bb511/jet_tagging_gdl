# Single-head Linformer of Laatu et al., arXiv:2510.24784, in float.
_target_: src.algorithms.linformer.Linformer
_convert_: all # plain dicts, since _set_up_scheduler pops from the scheduler
name: linformer

nconstituents: ${data.nconstituents}
nbr_feats: ${len:${data.features}}
output_dim: 5

method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
transform_kwargs: ${data.transform_kwargs}

# The float point of get_llformer (calad0i/HGQ2-examples, jsc150/model.py), for every N.
embed_dim: 16
kv_proj_dim: 4 # k, the slots onto which the keys and values are projected
ff_dim: 16
head_layers: [16]
aggregation: sum_over_n
batchnorm: true

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1.0e-3
  weight_decay: 1.0e-7

scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: max
    patience: 80
    factor: 0.1
    threshold: 1.0e-4
  monitor: val/acc
  interval: epoch
  frequency: 1

compile: false
