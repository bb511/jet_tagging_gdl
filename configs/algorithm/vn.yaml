# Vector neurons on the lifts of (pt, eta, phi); per-N values in the experiment configs.
_target_: src.algorithms.vector_neurons.VectorNeurons
_convert_: all # plain dicts, since _set_up_scheduler pops from the scheduler
name: vn

nconstituents: ${data.nconstituents}
nbr_feats: 3 # required_features pins [pt, eta, phi]
output_dim: 5

method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
transform_kwargs: ${data.transform_kwargs}

num_blocks: 1
vector_channels: 16
scalar_channels: 64
invariants: 16
tensor_invariants: 2 # three-point correlators of three kinds; 0 builds none
stream_channels: 16 # per-constituent stream; 0 builds none
mlp_layers: 2
gate: true # false: the mixed vectors need not wait for the scalar MLP
head_layers: [64, 32]
dropout: 0.0
units: 20.0 # GeV per unit of p_T, the L-GATr-slim and LLoCa scale; never searched
axis_offset: false

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 2.0e-3
  weight_decay: 1.0e-2

# Stepped per batch; _set_up_scheduler injects total_steps.
scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.OneCycleLR
    _partial_: true
    max_lr: ${algorithm.optimizer.lr}
    pct_start: 0.2
  interval: step
  frequency: 1

compile: false
