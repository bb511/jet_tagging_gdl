# Gradient-boosted trees (scikit-learn's HistGradientBoostingClassifier) on the record's jet-level
# observables less the jet rapidity j_eta, 52 of them: the ceiling of the second model family for
# the rows exact under the beam boost, beside the MLP of jet_level_noeta52.yaml. Each epoch adds
# trees_per_epoch boosting iterations, one tree per class each, to one warm-started estimator, so
# that the networks' checkpointing, early stopping and val/acc_best apply unchanged. A copy of
# jet_level_bdt_all53.yaml that differs in name and nbr_feats (tests/test_configs.py keeps the
# rest in step).
_target_: src.algorithms.bdt.BoostedTreesClassifier
_convert_: all # the hyperparameters a checkpoint holds stay plain containers
name: jet_level_bdt_noeta52

# One slot per jet, holding its observables; data.nconstituents (150) only labels the row.
nconstituents: 1
# A number: the datamodule takes the observables from the shards at run time, so no list exists in
# the config to take the length of.
nbr_feats: 52
output_dim: 5

# Interpolated from the data config, which refuses every regime but the baseline.
method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
transform_kwargs: ${data.transform_kwargs}

# Never searched: the epoch count sets the number of iterations, up to 500 in a 50-epoch trial and
# 2000 in a 200-epoch training.
trees_per_epoch: 10
# scikit-learn's defaults. max_depth null or 0 sets no limit; the search spells it 0, since the
# Optuna sweeper writes a None choice as the string 'None'.
learning_rate: 0.1
max_leaf_nodes: 31
max_depth: null
min_samples_leaf: 20
l2_regularization: 0.0
max_features: 1.0

# No torch optimiser or scheduler: scikit-learn fits the trees.
optimizer: null
scheduler: null

compile: false
