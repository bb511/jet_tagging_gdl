# Gradient-boosted trees on the 52 jet-level observables without j_eta, a ceiling.
_target_: src.algorithms.bdt.BoostedTreesClassifier
_convert_: all # plain containers in the checkpoint's hyperparameters
name: jet_level_bdt_noeta52

nconstituents: 1 # one slot of observables per jet
nbr_feats: 52 # a number: the observables are read off the shards at run time
output_dim: 5

method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
transform_kwargs: ${data.transform_kwargs}

trees_per_epoch: 10 # never searched: the epoch count sets the iterations
# scikit-learn's defaults.
learning_rate: 0.1
max_leaf_nodes: 31
max_depth: null # no limit, which the search spells 0
min_samples_leaf: 20
l2_regularization: 0.0
max_features: 1.0

optimizer: null
scheduler: null

compile: false
