# L-GATr-slim with the spurions, arXiv:2512.17011; per-N values in the experiment configs.
_target_: src.algorithms.lgatr_slim.LGATrSlim
_convert_: all # plain dicts, since _set_up_scheduler pops from the scheduler
name: lgatr_slim

nconstituents: ${data.nconstituents}
nbr_feats: 4 # required_features pins [px, py, pz, e]
output_dim: 5

method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
transform_kwargs: ${data.transform_kwargs}

# The published slim tagger's size, about 2.0M parameters.
num_blocks: 12
hidden_v_channels: 32
hidden_s_channels: 96
num_heads: 8
mlp_ratio: 4
dropout: 0.0
units: 20.0 # GeV per unit, the references' scale; never searched
# The time vector and the beams of the published tagging setting: SO(2) about the beam is exact.
add_beams: true
add_time: true

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 3.0e-4
  weight_decay: 1.0e-2

# Stepped per batch; _set_up_scheduler injects total_steps.
scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.OneCycleLR
    _partial_: true
    max_lr: ${algorithm.optimizer.lr}
    pct_start: 0.2
  interval: step
  frequency: 1

# 1.7 to 2.1 times faster per training step than eager (olgpu V100, 2026-09-29).
compile: true
