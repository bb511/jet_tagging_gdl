# JEDI-linear on [pt, etarel, phirel] whose head also reads the jet moments.
_target_: src.algorithms.jedi_linear.JEDILinearMoments
_convert_: all # plain dicts, since _set_up_scheduler pops from the scheduler
name: jedi_linear_moments

nconstituents: ${data.nconstituents}
nbr_feats: 3 # required_features pins [pt, etarel, phirel]
output_dim: 5

method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
transform_kwargs: ${data.transform_kwargs}

# The published point of JEDI-linear, for every N.
hidden: 64
head_layers: [64, 32, 16]
aggregation: sum # for both pools
moments: uniform # five moments; rankcut adds those of the leading 1, 2, 4 and 8, 25 in all

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1.0e-3
  weight_decay: 1.0e-7

scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: max
    patience: 80
    factor: 0.1
    threshold: 1.0e-4
  monitor: val/acc
  interval: epoch
  frequency: 1

compile: false
