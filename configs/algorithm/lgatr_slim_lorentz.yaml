# L-GATr-slim without the spurions: configs/algorithm/lgatr_slim.yaml with add_beams and add_time
# false, everything else identical (tests/test_configs.py keeps the two in step). Reading the
# constituents' four-momenta alone, the network is invariant under the full Lorentz group, where
# the spurions leave SO(2) about the beam axis, so the two rows differ in the embedded group and in
# nothing else. Per-nconstituents values in configs/experiment/hls4ml/lgatr_slim_lorentz_<N>.yaml.
_target_: src.algorithms.lgatr_slim.LGATrSlim
_convert_: all # _set_up_scheduler pops from the scheduler dict, so it must not be a DictConfig
name: lgatr_slim_lorentz

nconstituents: ${data.nconstituents}
nbr_feats: 4 # not ${len:...}: the net reads the four-momentum alone, so features must be px,py,pz,e
output_dim: 5

# Interpolated, so one CLI override (data.method=symm_loss) configures data and algorithm together.
# Scripted in the baseline regime alone, so both resolve to augmentation/none.
method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
symm_loss_metric: l2
transform_kwargs: ${data.transform_kwargs}

num_blocks: 12
hidden_v_channels: 32
hidden_s_channels: 96
num_heads: 8
mlp_ratio: 4
dropout: 0.0
units: 20.0 # GeV per unit, see lgatr_slim.yaml; never searched
# The two switches: no time vector and no beams, so the full Lorentz group is exact.
add_beams: false
add_time: false

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 3.0e-4
  weight_decay: 1.0e-2

# One cycle over the whole run, hence stepped per batch. total_steps is injected by
# JetTaggingModule._set_up_scheduler, the run length being known only once the trainer is attached.
scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.OneCycleLR
    _partial_: true
    max_lr: ${algorithm.optimizer.lr}
    pct_start: 0.2
  interval: step
  frequency: 1

compile: false
