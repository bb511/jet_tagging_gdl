# Vector neurons trained quantisation-aware with HGQ2 (Keras on JAX) for synthesis with alkaid: the
# vn network behind fixed-point quantisers, read from the trigger words (pt, eta, phi). Lightning
# keeps the loop and Keras owns the weights, the optimiser and the step. Per-nconstituents values in
# configs/experiment/hls4ml/vn_hgq_<N>.yaml.
_target_: src.algorithms.vector_neurons_hgq.VectorNeuronsHGQ
_convert_: all # the quantisation, the beta schedule and the device list reach Python as containers
name: vn_hgq

nconstituents: ${data.nconstituents}
nbr_feats: 3 # not ${len:...}: the net reads pt, eta and phi alone, so features must be pt,eta,phi
output_dim: 5

# Interpolated as in vn.yaml. The Keras step has no SCL term, so setup() refuses symm_loss.
method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
transform_kwargs: ${data.transform_kwargs}

num_blocks: 1
vector_channels: 16 # lifted vector channels of every block
scalar_channels: 64 # scalar channels of every block
invariants: 16 # forms read in every block and in the readout
tensor_invariants: 2 # three-point correlators of each of three kinds, read by the first block; 0 builds none
stream_channels: 16 # width of the per-constituent stream; 0 builds none
mlp_layers: 2 # linear layers of the scalar MLP of every block, ReLU between them
gate: true # false passes the mixed vectors ungated, so that they need not wait for the scalar MLP
head_layers: [64, 32] # hidden widths of the readout MLP
dropout: 0.0
# GeV per unit of p_T: a power of two, so that p is a shift of the p_T word. The copy of a float vn
# folds its 20 GeV into the batch normalisations.
units: 16.0
# true reads the leader's eta and phi from the full jet's axis as two more scalars of the first
# block: a test of what that axis is worth, with data.full_axis true, nbr_feats 5 and data.features
# [pt, eta, phi, etarel, phirel] (hparams_search/hls4ml/vn_cheap_axis_optuna.yaml).
axis_offset: false

quantisation:
  # (keep_negative, integer bits, fraction bits) of the trigger words: p_T on [0, 4096) GeV at
  # 0.25 GeV and the angles from the leading constituent on [-2, 2) rad at 2^-8 rad, then the logits.
  pt_kif: [0, 12, 2]
  angle_kif: [1, 1, 8]
  output_kif: [1, 6, 8]
  # Seeded before training. On the two-block float finals at N = 16 (dry run of 2026-10-07),
  # seeding 14 data and 8 weight bits cost 0.10 points of accuracy at 2.85 M EBOPs, and 12 and 10
  # bits 0.87 points.
  data_bits: 14 # i + f of every trainable datalane
  weight_bits: 8 # bits of every weight and bias
  gate_f: 8 # fraction bits of the hard-sigmoid gates
  float_mode: false # true: every quantiser but the gates' clamp is the identity
  # true: no batch normalisation in the port; the copy of init_from folds each into the dense layer
  # that reads it, which saves alkaid its separate constant multiply and add.
  fold_norm: false
  # Rounding of every trainable datalane: RND to nearest, a half-LSB constant adder in the RTL, or
  # TRN, truncation, a free drop of bits. The fixed quantisers keep RND.
  round_mode: RND

beta: 1.0e-7 # weight of the EBOPs in the loss, constant over the run unless a schedule is set
beta_schedule: null # [[epoch, beta, linear|log|constant], ...] of HGQ2's PieceWiseSchedule
init_from: null # a float vn run directory, manifest or .ckpt of the same architecture, copied first
calibration_jets: 100000 # training jets on which the datalane bits are seeded
floatx: float64 # Keras's float type; float64 reproduces the fixed-point arithmetic exactly
# JAX runs on the trainer's accelerator and devices; setting these apart runs it elsewhere.
jax_platform: ${trainer.accelerator}
jax_devices: ${trainer.devices}

optimizer:
  _target_: keras.optimizers.AdamW
  _partial_: true
  weight_decay: 0.05
  epsilon: 1.0e-8
  global_clipnorm: 1.0 # in place of the trainer's clipping, which manual optimisation refuses

# Stepped per batch by Keras. decay_steps and warmup_steps are injected by configure_optimizers, the
# run length being known only once the trainer is attached.
scheduler:
  _target_: keras.optimizers.schedules.CosineDecay
  _partial_: true
  initial_learning_rate: 1.0e-3
  alpha: 1.0e-2 # the rate ends at 1e-5
  warmup_target: null # a rate: warm up to it from initial_learning_rate over warmup_fraction
warmup_fraction: 0.0 # of the steps

compile: false
