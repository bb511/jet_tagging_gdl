# vn trained quantisation-aware with HGQ2 on Keras/JAX, for synthesis with alkaid.
_target_: src.algorithms.vector_neurons_hgq.VectorNeuronsHGQ
_convert_: all # plain containers for quantisation, beta_schedule and jax_devices
name: vn_hgq

nconstituents: ${data.nconstituents}
nbr_feats: 3 # required_features pins [pt, eta, phi]
output_dim: 5

method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
transform_kwargs: ${data.transform_kwargs}

num_blocks: 1
vector_channels: 16
scalar_channels: 64
invariants: 16
tensor_invariants: 2 # three-point correlators of three kinds; 0 builds none
stream_channels: 16 # per-constituent stream; 0 builds none
mlp_layers: 2
gate: true # false: the mixed vectors need not wait for the scalar MLP
head_layers: [64, 32]
dropout: 0.0
units: 16.0 # GeV per unit of p_T, a power of two so that p is a shift of the p_T word
axis_offset: false

quantisation:
  # (keep_negative, integer bits, fraction bits) of the p_T, angle and logit words.
  pt_kif: [0, 12, 2]
  angle_kif: [1, 1, 8]
  output_kif: [1, 6, 8]
  data_bits: 14 # i + f of every trainable datalane, seeded before training
  weight_bits: 8
  gate_f: 8 # fraction bits of the hard-sigmoid gates
  float_mode: false # true: every quantiser but the gates' clamp is the identity
  fold_norm: false # true: batch norms folded into dense layers, saving alkaid a multiply-add
  round_mode: RND # TRN truncates, saving RND's half-LSB adder; fixed quantisers keep RND
  trained_words: false # true: p_T and angle words trained per slot from these widths

beta: 1.0e-7 # weight of the EBOPs in the loss, constant unless beta_schedule is set
beta_schedule: null # [[epoch, beta, linear|log|constant], ...] of HGQ2's PieceWiseSchedule
init_from: null # a float vn run directory, manifest or .ckpt, copied first
calibration_jets: 100000 # training jets that seed the datalane bits
floatx: float64 # reproduces the fixed-point arithmetic exactly
jax_platform: ${trainer.accelerator}
jax_devices: ${trainer.devices}

optimizer:
  _target_: keras.optimizers.AdamW
  _partial_: true
  weight_decay: 0.05
  epsilon: 1.0e-8
  global_clipnorm: 1.0 # manual optimisation refuses the trainer's clipping

# Stepped per batch by Keras; configure_optimizers injects decay_steps.
scheduler:
  _target_: keras.optimizers.schedules.CosineDecay
  _partial_: true
  initial_learning_rate: 1.0e-3
  alpha: 1.0e-2 # the rate ends at 1e-5

compile: false
