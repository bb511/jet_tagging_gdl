# DeepSets, the permutation-invariant tagger. Defaults here, tuned widths and rates in
# configs/experiment/hls4ml/deepsets_<N>.yaml.
_target_: src.algorithms.deepsets.DeepSets
_convert_: all # _set_up_scheduler pops from the scheduler dict, so it must not be a DictConfig
name: deepsets

nconstituents: ${data.nconstituents}
nbr_feats: ${len:${data.features}}
output_dim: 5

# Interpolated, so one CLI override (data.method=symm_loss) configures data and algorithm together.
method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
symm_loss_metric: l2
transform_kwargs: ${data.transform_kwargs}

phi_layers: [64, 64, 32]
rho_layers: [32, 32, 16]
activation: relu
aggregation: mean
dropout: 0.0
mask: true

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1.0e-3
  weight_decay: 1.0e-7

scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: max
    patience: 80
    factor: 0.1
    threshold: 1.0e-4
  monitor: val/acc
  interval: epoch
  frequency: 1

compile: false
