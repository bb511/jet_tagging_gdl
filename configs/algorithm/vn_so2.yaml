# Vector neurons with (E, px, py, pz) split into E, pz and (px, py): configs/algorithm/vn_z.yaml
# with symmetry so2, everything else identical (tests/test_configs.py keeps the two rows in step).
# SO(2) about the beam is exact and every other probe group, the beam boost included, is measured.
# Per-nconstituents values in configs/experiment/hls4ml/vn_so2_<N>.yaml.
_target_: src.algorithms.vector_neurons.VectorNeurons
_convert_: all # _set_up_scheduler pops from the scheduler dict, so it must not be a DictConfig
name: vn_so2

nconstituents: ${data.nconstituents}
nbr_feats: 4 # not ${len:...}: the net reads the four-momentum alone, so features must be px,py,pz,e
output_dim: 5

# Interpolated, so one CLI override (data.method=symm_loss) configures data and algorithm together.
# Scripted in the baseline regime alone, so both resolve to augmentation/none.
method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
symm_loss_metric: l2
transform_kwargs: ${data.transform_kwargs}

# The partition into weight-sharing splits, which sets the exact group: z ((px, py) and (E, pz):
# SO(2) about the beam times boosts along it) or so2 (E, pz and (px, py): SO(2) about the beam).
symmetry: so2
num_blocks: 3
vector_channels: 16 # four-vector channels of every block
scalar_channels: 64 # scalar channels of every block
invariants: 16 # invariant products read in every block and in the readout
head_layers: [64, 32] # hidden widths of the readout MLP
dropout: 0.0
units: 20.0 # GeV per unit, the L-GATr-slim and LLoCa rows' scale; never searched

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 2.0e-3
  weight_decay: 1.0e-2

# One cycle over the whole run, hence stepped per batch. total_steps is injected by
# JetTaggingModule._set_up_scheduler, the run length being known only once the trainer is attached.
scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.OneCycleLR
    _partial_: true
    max_lr: ${algorithm.optimizer.lr}
    pct_start: 0.2
  interval: step
  frequency: 1

compile: false
