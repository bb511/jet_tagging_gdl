# LLoCa with SO(3) frames, the control group; per-N values in the experiment configs.
_target_: src.algorithms.lloca.LLoCa
_convert_: all # plain dicts, since _set_up_scheduler pops from the scheduler
name: lloca_so3

nconstituents: ${data.nconstituents}
nbr_feats: 4 # required_features pins [px, py, pz, e]
output_dim: 5

method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
transform_kwargs: ${data.transform_kwargs}

frames: so3
# The tagging guide's size-0 LLoCa-Transformer: 8x0n+2x1n per head, so 128 channels.
num_blocks: 8
num_heads: 8
attn_scalars: 8
attn_vectors: 2
mlp_factor: 2
dropout: 0.0
framesnet_hidden: 32
framesnet_dropout: 0.0 # 0 adds no layer, as the checkpoints expect
mass_reg: 2.5e-4 # the references' 5 MeV in units; never searched
units: 20.0 # GeV per unit, the L-GATr-slim scale; never searched

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 3.0e-4
  weight_decay: 1.0e-2

# Stepped per batch; _set_up_scheduler injects total_steps.
scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.OneCycleLR
    _partial_: true
    max_lr: ${algorithm.optimizer.lr}
    pct_start: 0.2
  interval: step
  frequency: 1

# 25 to 35 % less time per step than eager (olgpu V100, 2026-09-30); eager in the N = 16 searches.
compile: true
