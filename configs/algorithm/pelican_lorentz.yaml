# PELICAN without the beams, Lorentz-exact; per-N values in the experiment configs.
_target_: src.algorithms.pelican.PELICAN
_convert_: all # plain dicts, since _set_up_scheduler pops from the scheduler
name: pelican_lorentz

nconstituents: ${data.nconstituents}
nbr_feats: 4 # required_features pins [px, py, pz, e]
output_dim: 5

method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
transform_kwargs: ${data.transform_kwargs}

n_hidden: 25
n_message: 15
n_blocks: 5
dropout: 0.025
nbar: 47.0 # mean multiplicity, no beams; set per experiment
add_beams: false
n_chunks: 1 # speed knob, never searched; set per experiment

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-3
  weight_decay: 5.0e-3

scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: max
    patience: 80
    factor: 0.1
    threshold: 1.0e-4
  monitor: val/acc
  interval: epoch
  frequency: 1

compile: false
