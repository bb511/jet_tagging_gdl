# PELICAN with the beams, arXiv:2307.16506; per-N values in the experiment configs.
_target_: src.algorithms.pelican.PELICAN
_convert_: all # plain dicts, since _set_up_scheduler pops from the scheduler
name: pelican

nconstituents: ${data.nconstituents}
nbr_feats: 4 # required_features pins [px, py, pz, e]
output_dim: 5

method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
transform_kwargs: ${data.transform_kwargs}

# The paper's 25/15 point: 11k with its factorised aggregation weights, 32.6k here.
n_hidden: 25
n_message: 15 # 0 drops the messaging MLP
n_blocks: 5
dropout: 0.025
nbar: 49.0 # mean multiplicity plus the two beams; set per experiment
add_beams: true # SO(2) about the beam exact; false: the full Lorentz group
n_chunks: 1 # speed knob, never searched; set per experiment

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-3
  weight_decay: 5.0e-3

scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: max
    patience: 80
    factor: 0.1
    threshold: 1.0e-4
  monitor: val/acc
  interval: epoch
  frequency: 1

compile: false
