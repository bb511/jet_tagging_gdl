# Flattened-input MLP, the tagger with no symmetry built in at all.
_target_: src.algorithms.mlp.MLPClassifier
_convert_: all # _set_up_scheduler pops from the scheduler dict, so it must not be a DictConfig
name: mlp

nconstituents: ${data.nconstituents}
nbr_feats: ${len:${data.features}}
output_dim: 5

# Interpolated, so one CLI override (data.method=symm_loss) configures data and algorithm together.
method: ${data.method}
group: ${data.augmentation_scheme}
symm_loss_weight: 0.1
symm_loss_metric: l2
transform_kwargs: ${data.transform_kwargs}

# The flattened (N x F) input grows with N (64 columns at N=16, 600 at N=150); these widths do not.
hidden_layers: [128, 64, 32]
activation: relu
batchnorm: false

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1.0e-3
  weight_decay: 1.0e-7

scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: max
    patience: 80
    factor: 0.1
    threshold: 1.0e-4
  monitor: val/acc
  interval: epoch
  frequency: 1

compile: false
