# @package _global_

# The order of the defaults decides which config overrides which: later entries win.
defaults:
  - _self_
  - data: hls4ml
  - algorithm: deepsets
  - callbacks: default
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default
  - logger: none

  # An experiment config pins one (architecture, nconstituents) pair; the method and the
  # symmetry group stay command-line overrides, e.g.
  #   python src/train.py experiment=hls4ml/deepsets_16 data.method=symm_loss \
  #       data.augmentation_scheme=so2
  - experiment: null

  - hparams_search: null

  # Machine-specific settings, excluded from version control, hence optional.
  - optional local: default

  # Enable from the command line, e.g. `python src/train.py debug=default`.
  - debug: null

task_name: "train"

# Overwrite from the command line with `tags="[first_tag, second_tag]"`.
tags: ["dev"]

experiment_name: jet_tagging_gdl_dev

# The output directory is unique per run, so its hash names the run in MLflow.
run_name: ${short_hash:${hydra:runtime.output_dir},12}

# Resume training from this checkpoint.
ckpt_path: null

# What train.py returns, and therefore what an Optuna study maximises. The main run's
# value, not a fold average, so the objective is one clean number per trial.
optimized_metric: val/acc_best

seed: 12345
