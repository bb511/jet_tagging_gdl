# The same jets as configs/data/hls4ml.yaml, read from the published record rather than
# from the Zenodo tarballs. The record ships the split, the pT sorting and the physics
# normalisation as a loader package of its own, so those stages are fixed there and only
# the wrapper is configured here. Everything below repo_id/revision/cache_dir has the
# same meaning as in hls4ml.yaml and is inherited from HLS4MLDataModule.
_target_: src.data.hls4ml_hf_datamodule.HLS4MLHFDataModule

# A local directory is read directly, which is how the mirror is checked before upload.
repo_id: fastmachinelearning/hls4ml_lhc_jets_150p

# The record ships executable code as well as data, so a run reads and executes whatever
# is at this commit. null follows the head of the record instead, leaving what a run
# trained on decided by when it was launched. Move it forward after a re-upload.
revision: 8cfaed27b9d1df48987331a3e25cfda166aaabe3

# Mapped onto the record's paths.base_data_dir: where its cached .npy arrays and
# norm_params.npz land, beside the ones the raw route builds under data/.
cache_dir: ${paths.root_dir}/data/hf

method: augmentation
batch_size: 256
num_workers: 4
pin_memory: True
nconstituents: 32
features: ["px", "py", "pz", "etarel", "phirel"]
augmentation_scheme: none
augmentation_seed: ${seed}
lorentz_eta_max: 2.0
n_folds: 5
keep_full_features_at_test: true
