# The hls4ml LHC jets, through the loader package the record ships.
_target_: src.data.hls4ml_datamodule.HLS4MLDataModule

revision: fc7104f60a45d528ab597b220d5a7cd8e31cfff8 # pinned: the record ships executable code

cache_dir: ${paths.base_data_dir}/hf

method: augmentation

augmentation_scheme: none

transform_kwargs:
  lorentz_eta_max: 1.0 # rapidity half-width of the beam boost, JetCLR's shift range

nconstituents: 16

features: [px, py, pz, e]

batch_size: 2048
num_workers: 4 # persistent; 0 is 1.8x slower per epoch (DeepSets, N=16, augmentation)
pin_memory: true

n_folds: 5
kfold_seed: 42

full_axis: false
