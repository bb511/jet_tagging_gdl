# The hls4ml LHC jets. The record ships the split, the pT sorting and the normalisation in a loader
# package of its own, so only the wrapper is configured here.
_target_: src.data.hls4ml_datamodule.HLS4MLDataModule

# A local directory of this name is read directly, which is how a mirror is checked before upload.
repo_id: fastmachinelearning/hls4ml_lhc_jets_150p

# The record ships executable code, so a run executes whatever is at this commit (null: the head).
revision: fc7104f60a45d528ab597b220d5a7cd8e31cfff8

# Per-nconstituents caches, reused if the directory exists; the snapshot goes to HF_HUB_CACHE.
cache_dir: ${paths.base_data_dir}/hf

# augmentation: online so2/so3/lorentz on train batches | symm_loss: SCL, no augmentation
method: augmentation

# none | so2 | so3 | lorentz | lorentz_iso, the last two being the boost along the beam and the
# boost of isotropic direction. Under symm_loss it names the group the SCL draws from.
augmentation_scheme: none

# Half-width of the uniform rapidity of the beam boost, JetCLR's shift range; the sample's jets sit
# within |eta| <~ 1.65. The isotropic probe boost (lorentz_iso) shares it.
lorentz_eta_max: 1.0

# Experiments use 16, 50 and 150; 150 is every constituent the record carries.
nconstituents: 16

# Any subset of the 16 record columns; LorentzNet needs exactly these four.
features: [px, py, pz, e]

batch_size: 256
num_workers: 4
pin_memory: true

# 1: the record's split; k >= 2: pool train+val and re-split (experiments set 5).
n_folds: 1
kfold_seed: 42

# Test batches keep all 16 columns so the invariance probes find px, py and pz.
keep_full_features_at_test: true
