# The top-quark tagging reference set (Zenodo 2603256), two classes.
_target_: src.data.top_tagging_datamodule.TopTaggingDataModule

cache_dir: ${paths.base_data_dir}/top_tagging

method: augmentation

augmentation_scheme: none

transform_kwargs:
  lorentz_eta_max: 1.0 # as on hls4ml, so that both data sets are probed alike

nconstituents: 100

features: [px, py, pz, e]

batch_size: 256
num_workers: 4
pin_memory: true

n_folds: 5
kfold_seed: 42
